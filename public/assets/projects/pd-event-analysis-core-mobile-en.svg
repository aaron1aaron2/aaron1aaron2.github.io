<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 735" role="img" aria-labelledby="title desc" lang="en">
<title id="title">An alert arrived. Which waveforms are ready to analyze?</title><desc id="desc">An analysis can succeed with only partial data coverage. Event source → platform: Track alerts in arrival order. Use event time to locate the analysis window. Waveform data → analysis dispatch: Check waveform readiness for the event window before PD analysis Analysis service → event view: Display PRPD, execution status and data coverage</desc>
