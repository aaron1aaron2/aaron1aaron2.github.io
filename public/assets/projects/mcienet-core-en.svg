<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 718" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How can DNA sequences predict chromatin interactions?</title><desc id="desc">Part of preprocessing derives from ChINN. The figure summarizes the research method. Local patterns: Use multiscale convolution to capture short-range features Broader sequence context: Represent the sequence pair at multiple scales Combine paired representations: Estimate interaction from the paired features Ablation and cross-dataset tests: Assess scale choices and dataset dependence Model interpretation: Inspect which sequence regions influence the model</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
