<text x="55" y="276.34000000000003" fill="#52636d" font-size="16.5"><tspan x="55" dy="0">Fill in data and organize</tspan><tspan x="55" dy="21.12">attachments</tspan></text>
<rect x="395" y="190" width="250" height="125" rx="5" fill="#faf6ee" stroke="#8c6b37" stroke-width="2"/>
<text x="410" y="222.42" fill="#71572b" font-size="19.5" font-weight="600"><tspan x="410" dy="0">Applicant reviews and</tspan><tspan x="410" dy="24.96">confirms</tspan></text>
<text x="410" y="276.34000000000003" fill="#52636d" font-size="16.5"><tspan x="410" dy="0">Confirmation bound to</tspan><tspan x="410" dy="21.12">case revision</tspan></text>
<rect x="750" y="190" width="250" height="125" rx="5" fill="#fff" stroke="#7b9899" stroke-width="1.5"/>
