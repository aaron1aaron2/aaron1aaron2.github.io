<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 806" role="img" aria-labelledby="title desc" lang="en">
<title id="title">TownPass: preparation, confirmation and simulated submission</title><desc id="desc">Final scope: one-time, one case, one helper; revoking future access does not cancel an existing submission. Solid arrows show process or data flow; dashed arrows show review, conditions or feedback.</desc>
