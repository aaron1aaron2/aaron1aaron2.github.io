<text x="410" y="531.3399999999999" fill="#52636d" font-size="16.5"><tspan x="410" dy="0">Form or attachment edits</tspan><tspan x="410" dy="21.12">invalidate consent</tspan></text>
<rect x="750" y="445" width="250" height="125" rx="5" fill="#fff" stroke="#7b9899" stroke-width="1.5"/>
