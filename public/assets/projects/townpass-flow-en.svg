<text x="765" y="531.3399999999999" fill="#52636d" font-size="16.5"><tspan x="765" dy="0">Retries return the same</tspan><tspan x="765" dy="21.12">submission</tspan></text>
<rect x="661" y="213" width="90.56000000000002" height="23.48" fill="#fff"/>
