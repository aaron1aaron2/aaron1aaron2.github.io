<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 710" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">事件到達序與波形完整性分開處理</title><desc id="desc">分析成功可同時是資料部分完整；設備錄音與完整現場整合另作驗證。 實線表示資料或處理流程；虛線表示審查、條件或回饋。</desc>
