<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 716" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How can tracking reconnect to the same person?</title><desc id="desc">The figure shows the ReID work I owned within the team tracking system. Both thresholds pass: Appearance similarity and supporting-match ratio both qualify Compare appearance across frames: Use FastReID for similarity and supporting-match ratios Reconnect the track: Link the match back to the tracking record At least one threshold fails: Similarity or the supporting-match ratio is too low Keep both checks: A high single-frame score still needs support Retain uncertainty: Avoid merging identities on weak evidence</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="716" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">How can tracking reconnect to the same</tspan><tspan x="28" dy="40.96">person?</tspan></text>
<text x="28" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">Tracking condition</tspan></text><text x="261" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="261" dy="0">Evidence</tspan></text><text x="494" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="494" dy="0">Action</tspan></text><path d="M226 286.92H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 286.92H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="163.68" width="198" height="246.48000000000002" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="194.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Both</tspan><tspan x="43" dy="28.16">thresholds</tspan><tspan x="43" dy="28.16">pass</tspan></text><text x="43" y="279.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Appearance</tspan><tspan x="43" dy="25.6">similarity and</tspan><tspan x="43" dy="25.6">supporting-</tspan><tspan x="43" dy="25.6">match ratio both</tspan><tspan x="43" dy="25.6">qualify</tspan></text><rect x="261" y="163.68" width="198" height="246.48000000000002" rx="4" fill="white" stroke="#a7babb"/><text x="276" y="194.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="276" dy="0">Compare</tspan><tspan x="276" dy="28.16">appearance</tspan><tspan x="276" dy="28.16">across frames</tspan></text><text x="276" y="279.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">Use FastReID for</tspan><tspan x="276" dy="25.6">similarity and</tspan><tspan x="276" dy="25.6">supporting-</tspan><tspan x="276" dy="25.6">match ratios</tspan></text><rect x="494" y="163.68" width="198" height="246.48000000000002" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="509" y="194.68" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="509" dy="0">Reconnect the</tspan><tspan x="509" dy="28.16">track</tspan></text><text x="509" y="251" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">Link the match</tspan><tspan x="509" dy="25.6">back to the</tspan><tspan x="509" dy="25.6">tracking record</tspan></text><path d="M226 520.52H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 520.52H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="424.16" width="198" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="455.16" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">At least one</tspan><tspan x="43" dy="28.16">threshold fails</tspan></text><text x="43" y="511.48" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Similarity or the</tspan><tspan x="43" dy="25.6">supporting-</tspan><tspan x="43" dy="25.6">match ratio is</tspan><tspan x="43" dy="25.6">too low</tspan></text><rect x="261" y="424.16" width="198" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="276" y="455.16" fill="#18353d" font-size="22" font-weight="700"><tspan x="276" dy="0">Keep both</tspan><tspan x="276" dy="28.16">checks</tspan></text><text x="276" y="511.48" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">A high single-</tspan><tspan x="276" dy="25.6">frame score still</tspan><tspan x="276" dy="25.6">needs support</tspan></text><rect x="494" y="424.16" width="198" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="455.16" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">Retain</tspan><tspan x="509" dy="28.16">uncertainty</tspan></text><text x="509" y="511.48" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">Avoid merging</tspan><tspan x="509" dy="25.6">identities on</tspan><tspan x="509" dy="25.6">weak evidence</tspan></text>
<path d="M28 641.88H692" stroke="#a7babb"/><text x="28" y="666.88" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">The figure shows the ReID work I owned within the team tracking</tspan><tspan x="28" dy="25.6">system.</tspan></text>
</g></svg>
