<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" width="1000" height="592" role="img" aria-labelledby="title desc" xml:lang="zh-Hant">
<title id="title">出廠檢測作業台</title><desc id="desc">我把量測計畫、工單與待測物分層，讓操作人員在同一個工作區確認測點、對照基準並處理缺測。</desc>
<style>text{font-family:system-ui,"Microsoft JhengHei",sans-serif;fill:#20312e;font-size:20px}.title{font-weight:750;font-size:34px}.heading{font-weight:700;font-size:21px}.small,.pill{font-size:17px}.pill{font-weight:700}.muted{fill:#47605a;font-size:18px}</style>
<rect x="1" y="1" width="998" height="590" rx="18" fill="#f4f7f5" stroke="#cad5d0"/><text x="28" y="43" class="muted">設計示意｜虛構資料</text><text x="28" y="87" class="title">出廠檢測作業台</text><rect x="28" y="120" width="294" height="55" rx="10" fill="#fff" stroke="#ccd6d2"/><text x="43" y="154" class="heading">量測計畫</text><rect x="346" y="120" width="294" height="55" rx="10" fill="#fff" stroke="#ccd6d2"/><text x="361" y="154" class="heading">工單</text><text x="322" y="154" class="muted">→</text><rect x="664" y="120" width="294" height="55" rx="10" fill="#dceee8" stroke="#ccd6d2"/><text x="679" y="154" class="heading">待測物</text><text x="640" y="154" class="muted">→</text><rect x="28" y="196" width="248" height="318" rx="10" fill="#fff" stroke="#ccd6d2"/><text x="46" y="229" class="heading">階段與測點</text><text x="46" y="277" class="label">待機｜測點 A</text><rect x="46" y="297" width="208" height="1" rx="0" fill="#dbe3e0" stroke="none"/><text x="46" y="335" class="label">運轉｜測點 B</text><rect x="46" y="352" width="181" height="36" rx="18" fill="#f9ebcb" stroke="none"/><text x="59" y="376" class="pill">缺少讀值</text><rect x="292" y="196" width="370" height="318" rx="10" fill="#fff" stroke="#ccd6d2"/><text x="310" y="229" class="heading">當次量測與良品基準</text><path d="M327 271v130h302" stroke="#9dadab" fill="none" stroke-width="3" /><rect x="329" y="310" width="294" height="35" rx="0" fill="#e0eeea" stroke="none"/><path d="M332 333 l48 -8 47 10 48 -17 47 13 51 -5 50 1" stroke="#16736d" fill="none" stroke-width="3" /><rect x="327" y="440" width="14" height="14" rx="2" fill="#d2e9df" stroke="none"/><text x="350" y="454" class="small">良品基準</text><path d="M327 480h16" stroke="#16736d" fill="none" stroke-width="3" /><text x="350" y="485" class="small">已收到的測點</text><rect x="678" y="196" width="294" height="318" rx="10" fill="#fff" stroke="#ccd6d2"/><text x="696" y="229" class="heading">判定與後續</text><rect x="696" y="251" width="194" height="36" rx="18" fill="#f9ebcb" stroke="none"/><text x="709" y="275" class="pill">無法判定</text><text x="696" y="321" class="small">必要測點缺資料</text><rect x="696" y="345" width="253" height="1" rx="0" fill="#dbe3e0" stroke="none"/><text x="696" y="393" class="heading">重測指定測點</text><text x="696" y="447" class="small">提交人工複核</text><text x="28" y="558" class="muted">可能判定：OK／NG／無法判定</text>
</svg>
