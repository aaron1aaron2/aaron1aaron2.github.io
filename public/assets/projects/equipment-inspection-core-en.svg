<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 638" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How to inspect units across machine models</title><desc id="desc">Phase 2 software functionality passed acceptance. Phase 3 is validating pass/fail decisions on field samples. Measurement plan: Set stages and points for each model Reference library: Record, approve and version references and thresholds Work order and unit: Use the plan version on the work order and compare by point Pass, fail or inconclusive: Missing required points go to manual review Locate deviations: Trace deviations to stages, points and features</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="638" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">How to inspect units across machine</tspan><tspan x="28" dy="40.96">models</tspan></text>
<text x="28" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">Define the comparison</tspan></text><text x="261" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="261" dy="0">Inspect each unit</tspan></text><text x="494" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="494" dy="0">Keep the evidence</tspan></text><path d="M226 247.24H243.5V443.16H226" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M243.5 351.6H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 351.6H476.5V247.24H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M476.5 351.6V443.16H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="163.68" width="198" height="167.12" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="194.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Measurement</tspan><tspan x="43" dy="28.16">plan</tspan></text><text x="43" y="251" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Set stages and</tspan><tspan x="43" dy="25.6">points for each</tspan><tspan x="43" dy="25.6">model</tspan></text><rect x="28" y="346.8" width="198" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="377.8" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Reference</tspan><tspan x="43" dy="28.16">library</tspan></text><text x="43" y="434.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Record, approve</tspan><tspan x="43" dy="25.6">and version</tspan><tspan x="43" dy="25.6">references and</tspan><tspan x="43" dy="25.6">thresholds</tspan></text><rect x="261" y="255.24" width="198" height="192.72" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="276" y="286.24" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">Work order and</tspan><tspan x="276" dy="28.16">unit</tspan></text><text x="276" y="342.56" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">Use the plan</tspan><tspan x="276" dy="25.6">version on the</tspan><tspan x="276" dy="25.6">work order and</tspan><tspan x="276" dy="25.6">compare by point</tspan></text><rect x="494" y="163.68" width="198" height="167.12" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="194.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">Pass, fail or</tspan><tspan x="509" dy="28.16">inconclusive</tspan></text><text x="509" y="251" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">Missing required</tspan><tspan x="509" dy="25.6">points go to</tspan><tspan x="509" dy="25.6">manual review</tspan></text><rect x="494" y="346.8" width="198" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="377.8" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">Locate</tspan><tspan x="509" dy="28.16">deviations</tspan></text><text x="509" y="434.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">Trace deviations</tspan><tspan x="509" dy="25.6">to stages, points</tspan><tspan x="509" dy="25.6">and features</tspan></text>
<path d="M28 564.52H692" stroke="#a7babb"/><text x="28" y="589.52" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">Phase 2 software functionality passed acceptance. Phase 3 is</tspan><tspan x="28" dy="25.6">validating pass/fail decisions on field samples.</tspan></text>
