<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 941" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Domain model: plans, orders, test items and references</title><desc id="desc">Logical relationships, not three UI tabs or deployment topology. Reference recording and inspection are separate; changes are versioned. Deviation localization is not fault-root-cause identification. Solid arrows show process or data flow; dashed arrows show review, conditions or feedback.</desc>
