<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 564" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">並行開發如何保留可審查的證據？</title><desc id="desc">檢查重點是變更可追溯，合併和發布由人決定。 需求／回歸 → 問題紀錄: 保存問題、條件、責任及驗證基準 問題紀錄 → 隔離分支: 並行實作與驗證，把差異和測試寫入交付紀錄 驗證證據 → 人工審查: 查看 PR、測試與限制，再決定合併或退回</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="564" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">並行開發如何保留可審查的證</tspan><tspan x="28" dy="37.12">據？</tspan></text>
<rect x="76" y="125.24" width="352" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">需求／回歸 → 問題紀錄</tspan></text><text x="91" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">保存問題、條件、責任及驗證基準</tspan></text><circle cx="43" cy="149.24" r="14" fill="#0d5e55"/><text x="38" y="155.24" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">1</tspan></text><path d="M43 165.24V234" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="226" width="352" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="257" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">問題紀錄 → 隔離分支</tspan></text><text x="91" y="285.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">並行實作與驗證，把差異和測試寫入</tspan><tspan x="91" dy="25.6">交付紀錄</tspan></text><circle cx="43" cy="250" r="14" fill="#0d5e55"/><text x="38" y="256" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">2</tspan></text><path d="M43 266V360.36" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="352.36" width="352" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="91" y="383.36" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="91" dy="0">驗證證據 → 人工審查</tspan></text><text x="91" y="411.52000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">查看 PR、測試與限制，再決定合併</tspan><tspan x="91" dy="25.6">或退回</tspan></text><circle cx="43" cy="376.36" r="14" fill="#0d5e55"/><text x="38" y="382.36" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">3</tspan></text>
<path d="M28 490.72H428" stroke="#a7babb"/><text x="28" y="515.72" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">檢查重點是變更可追溯，合併和發布由人決定</tspan><tspan x="28" dy="25.6">。</tspan></text>
</g></svg>
