<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 691" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Four distinct questions in machine diagnosis</title><desc id="desc">When evidence is limited, retain only the conclusions it can support. Was the machine running?: Identify operating intervals before selecting samples. What kind of anomaly is present?: Check waveform features and coverage. How severe is it?: Define the denominator of the anomaly rate. When might degradation matter?: Remaining-life estimates need sufficient trend data.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="691" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">Four distinct questions in</tspan><tspan x="28" dy="37.12">machine diagnosis</tspan></text>
<text x="40" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">Diagnostic</tspan><tspan x="40" dy="21.76">question</tspan></text><text x="197" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="197" dy="0">Evidence and</tspan><tspan x="197" dy="21.76">limits</tspan></text><path d="M28 177.76H428" stroke="#a7babb"/><path d="M179 177.76V282.24" stroke="#a7babb"/><text x="40" y="206.76" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Was the</tspan><tspan x="40" dy="28.16">machine</tspan><tspan x="40" dy="28.16">running?</tspan></text><text x="197" y="206.76" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Identify operating</tspan><tspan x="197" dy="26.88">intervals before</tspan><tspan x="197" dy="26.88">selecting samples.</tspan></text><path d="M28 282.24H428" stroke="#a7babb"/><path d="M179 282.24V386.72" stroke="#a7babb"/><text x="40" y="311.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">What kind</tspan><tspan x="40" dy="28.16">of anomaly</tspan><tspan x="40" dy="28.16">is present?</tspan></text><text x="197" y="311.24" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Check waveform</tspan><tspan x="197" dy="26.88">features and</tspan><tspan x="197" dy="26.88">coverage.</tspan></text><path d="M28 386.72H428" stroke="#a7babb"/><path d="M179 386.72V487.36" stroke="#a7babb"/><text x="40" y="415.72" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">How severe</tspan><tspan x="40" dy="28.16">is it?</tspan></text><text x="197" y="415.72" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Define the</tspan><tspan x="197" dy="26.88">denominator of the</tspan><tspan x="197" dy="26.88">anomaly rate.</tspan></text><path d="M28 487.36H428" stroke="#a7babb"/><path d="M179 487.36V591.84" stroke="#a7babb"/><text x="40" y="516.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">When might</tspan><tspan x="40" dy="28.16">degradation</tspan><tspan x="40" dy="28.16">matter?</tspan></text><text x="197" y="516.36" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Remaining-life</tspan><tspan x="197" dy="26.88">estimates need</tspan><tspan x="197" dy="26.88">sufficient trend data.</tspan></text><path d="M28 591.84H428" stroke="#a7babb"/>
<path d="M28 616.84H428" stroke="#a7babb"/><text x="28" y="641.84" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">When evidence is limited, retain only the</tspan><tspan x="28" dy="25.6">conclusions it can support.</tspan></text>
</g></svg>
