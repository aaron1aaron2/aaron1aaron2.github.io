<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 623" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">從設備訊號到維護判斷</title><desc id="desc">核心設計是讓操作員從告警回查證據，並看清楚結果涵蓋哪些資料。 持續監測: 特徵、即時狀態與告警 事件與波形: 自動排程、手動要求與原始波形 工作流協調: 檢查資料就緒、派工，分別記錄任務與資料涵蓋 回查設備與事件: 趨勢、振動、局放與處理紀錄 支援維護判斷: 剩餘壽命推估、閾值與可回查報告</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="623" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">從設備訊號到維護判斷</tspan></text>
<text x="28" y="102.12" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">資料與觸發</tspan></text><rect x="28" y="116.12" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="147.12" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">持續監測</tspan></text><text x="43" y="175.28" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">特徵、即時狀態與</tspan><tspan x="43" dy="25.6">告警</tspan></text><rect x="234" y="116.12" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="147.12" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">事件與波形</tspan></text><text x="249" y="175.28" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">自動排程、手動要</tspan><tspan x="249" dy="25.6">求與原始波形</tspan></text><path d="M125 229.48000000000002V243.48000000000002H331V229.48000000000002" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 243.48000000000002V263.48" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="263.48" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="294.48" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">工作流協調</tspan></text><text x="43" y="322.64000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">檢查資料就緒、派工，分別記錄任務與資</tspan><tspan x="43" dy="25.6">料涵蓋</tspan></text><path d="M228 376.84000000000003V390.84000000000003H125V410.84000000000003" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 390.84000000000003H331V410.84000000000003" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="410.84000000000003" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="441.84000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">回查設備與事件</tspan></text><text x="43" y="470.00000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">趨勢、振動、局放</tspan><tspan x="43" dy="25.6">與處理紀錄</tspan></text><rect x="234" y="410.84000000000003" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="441.84000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">支援維護判斷</tspan></text><text x="249" y="470.00000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">剩餘壽命推估、閾</tspan><tspan x="249" dy="25.6">值與可回查報告</tspan></text>
<path d="M28 549.2H428" stroke="#a7babb"/><text x="28" y="574.2" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">核心設計是讓操作員從告警回查證據，並看清</tspan><tspan x="28" dy="25.6">楚結果涵蓋哪些資料。</tspan></text>
