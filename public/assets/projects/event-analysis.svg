<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">事件選取、批次分析與人工判讀</title><desc id="desc">未選時段不視為已診斷；不能由選定事件推估全時段漏報率。 實線表示資料或處理流程；虛線表示審查、條件或回饋。</desc>
