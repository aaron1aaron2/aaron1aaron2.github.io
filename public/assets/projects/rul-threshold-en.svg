<title id="title">Model recommendations, adoption policy and device commands</title><desc id="desc">Field lifetime ground truth and accuracy calibration are not established; a recommendation is not a device setting. Solid arrows show process or data flow; dashed arrows show review, conditions or feedback.</desc>
