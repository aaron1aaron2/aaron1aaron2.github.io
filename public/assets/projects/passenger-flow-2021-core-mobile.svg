<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 530" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">同一個車站，為何需要不同時段的表示？</title><desc id="desc">圖中說明模型表示的差異，成效以論文實驗為準。 固定車站表示: 每個時段沿用同一組車站特徵，作為比較觀點。 動態車站嵌入: 學習時變的車站關係，將表示送入下游流量模型。 方法驗證: 用流量估計實驗檢驗其適用範圍。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="530" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">同一個車站，為何需要不同時</tspan><tspan x="28" dy="37.12">段的表示？</tspan></text>
<text x="40" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">比較項</tspan></text><text x="197" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="197" dy="0">如何用於預測</tspan></text><path d="M28 156H428" stroke="#a7babb"/><path d="M179 156V256.64" stroke="#a7babb"/><text x="40" y="185" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">固定車站表示</tspan></text><text x="197" y="185" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">每個時段沿用同一組車</tspan><tspan x="197" dy="26.88">站特徵，作為比較觀點</tspan><tspan x="197" dy="26.88">。</tspan></text><path d="M28 256.64H428" stroke="#a7babb"/><path d="M179 256.64V357.28" stroke="#a7babb"/><text x="40" y="285.64" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">動態車站嵌入</tspan></text><text x="197" y="285.64" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">學習時變的車站關係，</tspan><tspan x="197" dy="26.88">將表示送入下游流量模</tspan><tspan x="197" dy="26.88">型。</tspan></text><path d="M28 357.28H428" stroke="#a7babb"/><path d="M179 357.28V431.03999999999996" stroke="#a7babb"/><text x="40" y="386.28" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">方法驗證</tspan></text><text x="197" y="386.28" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">用流量估計實驗檢驗其</tspan><tspan x="197" dy="26.88">適用範圍。</tspan></text><path d="M28 431.03999999999996H428" stroke="#a7babb"/>
<path d="M28 456.03999999999996H428" stroke="#a7babb"/><text x="28" y="481.03999999999996" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">圖中說明模型表示的差異，成效以論文實驗為</tspan><tspan x="28" dy="25.6">準。</tspan></text>
</g></svg>
