<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 692" role="img" aria-labelledby="title desc" lang="en">
<title id="title">What context matters for financial-text sentiment?</title><desc id="desc">The study used HAN and a sentiment lexicon. Investors supplied the labels. Document context: Represent article context with hierarchical attention Financial sentiment terms: Supply domain cues through sentiment terms Fuse the representations: Combine document and term signals for classification Labels and model selection: Use investor labels as targets and a validation split for selection Comparative evaluation: Compare classification on held-out data</desc>
