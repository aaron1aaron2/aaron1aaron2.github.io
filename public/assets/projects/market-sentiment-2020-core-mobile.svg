<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 634" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">金融文章的情緒判讀需要什麼脈絡？</title><desc id="desc">採既有 HAN 與情感詞典，情緒標記由投資者提供。 全文脈絡: 以階層式注意力表達文章內容 金融情感詞: 以情感詞表達領域線索 合併表示: 結合文章與詞彙線索判斷情感 標記與選模: 以投資者標記為目標並用驗證集選模 比較實驗: 在測試集比較情感分類結果</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="634" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">金融文章的情緒判讀需要什麼</tspan><tspan x="28" dy="37.12">脈絡？</tspan></text>
<text x="28" y="139.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">兩種文字線索</tspan></text><rect x="28" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">全文脈絡</tspan></text><text x="43" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">以階層式注意力表</tspan><tspan x="43" dy="25.6">達文章內容</tspan></text><rect x="234" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">金融情感詞</tspan></text><text x="249" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">以情感詞表達領域</tspan><tspan x="249" dy="25.6">線索</tspan></text><path d="M125 266.6V280.6H331V266.6" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 280.6V300.6" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="300.6" width="400" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="331.6" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">合併表示</tspan></text><text x="43" y="359.76000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">結合文章與詞彙線索判斷情感</tspan></text><path d="M228 388.36V402.36H125V422.36" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 402.36H331V422.36" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="422.36" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="453.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">標記與選模</tspan></text><text x="43" y="481.52000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">以投資者標記為目</tspan><tspan x="43" dy="25.6">標並用驗證集選模</tspan></text><rect x="234" y="422.36" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="453.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">比較實驗</tspan></text><text x="249" y="481.52000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">在測試集比較情感</tspan><tspan x="249" dy="25.6">分類結果</tspan></text>
<path d="M28 560.72H428" stroke="#a7babb"/><text x="28" y="585.72" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">採既有 HAN 與情感詞典，情緒標記由投資者</tspan><tspan x="28" dy="25.6">提供。</tspan></text>
