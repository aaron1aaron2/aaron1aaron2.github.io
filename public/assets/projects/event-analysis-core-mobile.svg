<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 609" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">保留完整事件紀錄，只分析有用的波形</title><desc id="desc">波形分析涵蓋選定的事件窗。 完整事件紀錄: 保留可索引與回查的事件 選定波形: 依設備與事件窗約定交接範圍 批次訊號分析: 以事件關聯波形、分析圖與說明 分析報告: 由本人逐頁核對判讀與圖表 重跑交接: 保留事件範圍、資料格式與步驟</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="609" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">保留完整事件紀錄，只分析有</tspan><tspan x="28" dy="37.12">用的波形</tspan></text>
<text x="28" y="139.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">資料交接</tspan></text><rect x="28" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">完整事件紀錄</tspan></text><text x="43" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">保留可索引與回查</tspan><tspan x="43" dy="25.6">的事件</tspan></text><rect x="234" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">選定波形</tspan></text><text x="249" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">依設備與事件窗約</tspan><tspan x="249" dy="25.6">定交接範圍</tspan></text><path d="M125 266.6V280.6H331V266.6" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 280.6V300.6" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="300.6" width="400" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="331.6" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">批次訊號分析</tspan></text><text x="43" y="359.76000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">以事件關聯波形、分析圖與說明</tspan></text><path d="M228 388.36V402.36H125V422.36" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 402.36H331V422.36" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="422.36" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="453.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">分析報告</tspan></text><text x="43" y="481.52000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">由本人逐頁核對判</tspan><tspan x="43" dy="25.6">讀與圖表</tspan></text><rect x="234" y="422.36" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="453.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">重跑交接</tspan></text><text x="249" y="481.52000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">保留事件範圍、資</tspan><tspan x="249" dy="25.6">料格式與步驟</tspan></text>
<path d="M28 560.72H428" stroke="#a7babb"/><text x="28" y="585.72" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">波形分析涵蓋選定的事件窗。</tspan></text>
</g></svg>
