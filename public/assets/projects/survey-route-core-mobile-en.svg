<title id="title">How can sampled addresses become a distance estimate?</title><desc id="desc">Validate the estimates against actual trips. Define each survey area: Group addresses by interviewer assignment Build point-to-point distances: Build a distance matrix and flag estimated entries Route and estimate: Solve TSP per area to return visit order, distance and a map</desc>
