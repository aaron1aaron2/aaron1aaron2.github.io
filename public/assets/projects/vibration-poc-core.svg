<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">在哪些條件下，振動資料足以支撐診斷？</title><desc id="desc">場域驗證用於判斷可行性及導入條件。 確認輸入: 對齊設備背景、波形涵蓋與有效運轉區間 逐段驗證: 依序核對運轉偵測、異常、嚴重度與壽命分析 限制報告結論: 保存中間產物與適用條件</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="304" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">在哪些條件下，振動資料足以支撐診斷？</tspan></text>
<path d="M226 161.44H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 161.44H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="91.96000000000001" width="198" height="138.96" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">確認輸入</tspan></text><text x="43" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">對齊設備背景、波</tspan><tspan x="43" dy="25.6">形涵蓋與有效運轉</tspan><tspan x="43" dy="25.6">區間</tspan></text><rect x="261" y="91.96000000000001" width="198" height="138.96" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="276" y="122.96000000000001" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">逐段驗證</tspan></text><text x="276" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">依序核對運轉偵測</tspan><tspan x="276" dy="25.6">、異常、嚴重度與</tspan><tspan x="276" dy="25.6">壽命分析</tspan></text><rect x="494" y="91.96000000000001" width="198" height="138.96" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">限制報告結論</tspan></text><text x="509" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">保存中間產物與適</tspan><tspan x="509" dy="25.6">用條件</tspan></text>
<path d="M28 255.92000000000002H692" stroke="#a7babb"/><text x="28" y="280.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">場域驗證用於判斷可行性及導入條件。</tspan></text>
</g></svg>
