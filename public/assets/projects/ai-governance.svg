<title id="title">自動修復與議題治理：工作關係示意</title>
<desc id="desc">自動修復與議題治理：測試監控、議題紀錄、AI 修復、複驗審查、回饋規範 的概念關係。已運行的測試、issue、修復分支及審查流程。修復保留驗證紀錄，合併與發布由人審查。非部署架構、客戶畫面或效能證據。</desc>
