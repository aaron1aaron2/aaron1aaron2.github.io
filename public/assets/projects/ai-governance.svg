<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 776" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">AI 任務並行與人工發布控制</title><desc id="desc">本人設計流程並作領域與產品判斷；未量測修復成功率或測試覆蓋率。 實線表示資料或處理流程；虛線表示審查、條件或回饋。</desc>
<defs><marker id="ai-governance-zh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="context-stroke"/></marker></defs>
