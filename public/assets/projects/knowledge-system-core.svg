<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">同一個版本，不同角色要查到什麼？</title><desc id="desc">文件入口已建立，內容與版本一致性持續檢查。 產品／主管：確認狀態: 由需求與版本回查決策及驗證狀態。 開發：核對設計: 從設計規格追到程式變更及測試。 現場：安裝與操作: 依版本查找安裝文件與相應操作手冊。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="368" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">同一個版本，不同角色要查到什麼？</tspan></text>
<text x="40" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">讀者與任務</tspan></text><text x="266" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="266" dy="0">可回查的資料</tspan></text><path d="M28 122.72000000000001H692" stroke="#a7babb"/><path d="M248 122.72000000000001V199.04000000000002" stroke="#a7babb"/><text x="40" y="151.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">產品／主管：確認狀</tspan><tspan x="40" dy="28.16">態</tspan></text><text x="266" y="151.72000000000003" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">由需求與版本回查決策及驗證狀態。</tspan></text><path d="M28 199.04000000000002H692" stroke="#a7babb"/><path d="M248 199.04000000000002V247.20000000000002" stroke="#a7babb"/><text x="40" y="228.04000000000002" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">開發：核對設計</tspan></text><text x="266" y="228.04000000000002" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">從設計規格追到程式變更及測試。</tspan></text><path d="M28 247.20000000000002H692" stroke="#a7babb"/><path d="M248 247.20000000000002V295.36" stroke="#a7babb"/><text x="40" y="276.20000000000005" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">現場：安裝與操作</tspan></text><text x="266" y="276.20000000000005" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">依版本查找安裝文件與相應操作手冊。</tspan></text><path d="M28 295.36H692" stroke="#a7babb"/>
<path d="M28 320.36H692" stroke="#a7babb"/><text x="28" y="345.36" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">文件入口已建立，內容與版本一致性持續檢查。</tspan></text>
</g></svg>
