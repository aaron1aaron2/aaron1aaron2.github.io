<title id="title">How can a forecast account for the metro network?</title><desc id="desc">The figure shows team research. My role was code and technical support. Masked passenger flow: Learn temporal context from flow signals Relations and distances: Learn spatial structure from station relationships and distances Hierarchical integration: Combine time, station and route signals Passenger-flow forecast: Evaluate the method in team experiments Publication: Knowledge-Based Systems</desc>
