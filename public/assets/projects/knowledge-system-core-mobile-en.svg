<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 641" role="img" aria-labelledby="title desc" lang="en">
<title id="title">What should each role be able to find for a release?</title><desc id="desc">Documentation entry points are in place and checked for release consistency. Product leads: check status: Trace decisions and validation status to requirements and releases. Engineers: verify design: Follow design specifications through changes and tests. Field teams: install and operate: Find installation and operating guidance for the release.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="641" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">What should each role be</tspan><tspan x="28" dy="37.12">able to find for a release?</tspan></text>
<text x="40" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">Reader and task</tspan></text><text x="197" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="197" dy="0">Traceable</tspan><tspan x="197" dy="21.76">information</tspan></text><path d="M28 177.76H428" stroke="#a7babb"/><path d="M179 177.76V310.4" stroke="#a7babb"/><text x="40" y="206.76" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Product</tspan><tspan x="40" dy="28.16">leads:</tspan><tspan x="40" dy="28.16">check</tspan><tspan x="40" dy="28.16">status</tspan></text><text x="197" y="206.76" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Trace decisions and</tspan><tspan x="197" dy="26.88">validation status to</tspan><tspan x="197" dy="26.88">requirements and</tspan><tspan x="197" dy="26.88">releases.</tspan></text><path d="M28 310.4H428" stroke="#a7babb"/><path d="M179 310.4V437.91999999999996" stroke="#a7babb"/><text x="40" y="339.4" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Engineers:</tspan><tspan x="40" dy="28.16">verify</tspan><tspan x="40" dy="28.16">design</tspan></text><text x="197" y="339.4" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Follow design</tspan><tspan x="197" dy="26.88">specifications</tspan><tspan x="197" dy="26.88">through changes and</tspan><tspan x="197" dy="26.88">tests.</tspan></text><path d="M28 437.91999999999996H428" stroke="#a7babb"/><path d="M179 437.91999999999996V542.4" stroke="#a7babb"/><text x="40" y="466.91999999999996" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Field teams</tspan><tspan x="40" dy="28.16">: install</tspan><tspan x="40" dy="28.16">and operate</tspan></text><text x="197" y="466.91999999999996" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Find installation and</tspan><tspan x="197" dy="26.88">operating guidance</tspan><tspan x="197" dy="26.88">for the release.</tspan></text><path d="M28 542.4H428" stroke="#a7babb"/>
<path d="M28 567.4H428" stroke="#a7babb"/><text x="28" y="592.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">Documentation entry points are in place</tspan><tspan x="28" dy="25.6">and checked for release consistency.</tspan></text>
