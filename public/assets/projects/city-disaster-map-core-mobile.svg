<title id="title">兩個尺度看懂防災資源配置</title><desc id="desc">我定義分析問題與提案規格。團隊以公開資料完成決賽展示。 行政區 × 人口: 各區設施或避難容量，相對於人口如何分布？ 景點 × 周邊設施: 哪些觀光點周邊的防災資源較集中或較少？</desc>
