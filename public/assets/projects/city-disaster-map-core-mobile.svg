<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">兩個尺度看懂防災資源配置</tspan></text>
<text x="40" y="104.12" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">分析尺度</tspan></text><text x="197" y="104.12" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="197" dy="0">要回答的問題</tspan></text><path d="M28 118.88000000000001H428" stroke="#a7babb"/><path d="M179 118.88000000000001V195.2" stroke="#a7babb"/><text x="40" y="147.88" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">行政區 × 人</tspan><tspan x="40" dy="28.16">口</tspan></text><text x="197" y="147.88" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">各區設施或避難容量，</tspan><tspan x="197" dy="26.88">相對於人口如何分布？</tspan></text><path d="M28 195.2H428" stroke="#a7babb"/><path d="M179 195.2V271.52" stroke="#a7babb"/><text x="40" y="224.2" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">景點 × 周邊</tspan><tspan x="40" dy="28.16">設施</tspan></text><text x="197" y="224.2" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">哪些觀光點周邊的防災</tspan><tspan x="197" dy="26.88">資源較集中或較少？</tspan></text><path d="M28 271.52H428" stroke="#a7babb"/>
