<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">怎麼把樣本地址轉成可估算的訪查路程？</title><desc id="desc">以實際訪查路程核對估算，才能確認誤差。 限定實際訪區: 依訪員負責區域分組 補齊點間距離: 建立距離矩陣，標記採估計規則的缺值 排序並估算: 分區求 TSP，產出拜訪順序、總距離與地圖</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="304" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">怎麼把樣本地址轉成可估算的訪查路程？</tspan></text>
<path d="M226 161.44H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 161.44H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="91.96000000000001" width="198" height="138.96" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">限定實際訪區</tspan></text><text x="43" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">依訪員負責區域分</tspan><tspan x="43" dy="25.6">組</tspan></text><rect x="261" y="91.96000000000001" width="198" height="138.96" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="276" y="122.96000000000001" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">補齊點間距離</tspan></text><text x="276" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">建立距離矩陣，標</tspan><tspan x="276" dy="25.6">記採估計規則的缺</tspan><tspan x="276" dy="25.6">值</tspan></text><rect x="494" y="91.96000000000001" width="198" height="138.96" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">排序並估算</tspan></text><text x="509" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">分區求 TSP，產</tspan><tspan x="509" dy="25.6">出拜訪順序、總距</tspan><tspan x="509" dy="25.6">離與地圖</tspan></text>
<path d="M28 255.92000000000002H692" stroke="#a7babb"/><text x="28" y="280.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">以實際訪查路程核對估算，才能確認誤差。</tspan></text>
</g></svg>
