<title id="title">工具型助理該讓使用者看到什麼？</title><desc id="desc">同時走查等待狀態、引用呈現與內部語境暴露的風險。 使用者 → 聊天介面: 提問後，介面顯示正在處理 檢索／工具 → 助理: 檢查知識來源的受眾，呈現工具執行回饋 助理 → 使用者: 呈現答案與可理解的來源</desc>
