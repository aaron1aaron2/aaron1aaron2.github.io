<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">託你辦系統架構</title><desc id="desc">兩支手機透過前端與同源API連到後端，後端保存案件與附件。</desc><rect width="1200" height="770" fill="#f6f4ee"/><style>text{font-family:'Microsoft JhengHei',sans-serif;fill:#253b34}.title{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.note{font-size:18px;fill:#536960}.box{fill:#fff;stroke:#8ca499;stroke-width:2}.arrow{fill:none;stroke:#46745e;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#46745e" stroke-width="1.5"/></marker></defs><text class="title" x="48" y="55">託你辦｜決賽材料中的系統架構</text><text class="note" x="48" y="90">依 2026-11-08 R6 講稿重繪；團隊系統說明，非個人獨立實作聲明</text><rect class="box" x="48" y="130" width="525" height="100" rx="10"/><text class="label" x="70" y="168">本人手機</text><text class="body" x="70" y="202">城市通 WebView／一般瀏覽器</text><rect class="box" x="627" y="130" width="525" height="100" rx="10"/><text class="label" x="649" y="168">代辦手機</text><text class="body" x="649" y="202">城市通 WebView／一般瀏覽器</text><path class="arrow" d="M310 232V267H600V295"/><path class="arrow" d="M890 232V267H600"/><rect class="box" x="230" y="300" width="740" height="95" rx="10"/><text class="label" x="252" y="338">Vue 3 ＋ TypeScript</text><text class="body" x="252" y="372">本人／代辦畫面；HTTPS、同源 API</text><path class="arrow" d="M600 397V435"/><rect class="box" x="230" y="440" width="740" height="95" rx="10"/><text class="label" x="252" y="478">Caddy → Node.js 22／Express 5</text><text class="body" x="252" y="512">Session · Grant · Case · Confirmation · Submit · Audit</text><path class="arrow" d="M600 537V570H325V593"/><path class="arrow" d="M600 570H875V593"/><rect class="box" x="95" y="598" width="460" height="94" rx="10"/><text class="label" x="117" y="636">SQLite</text><text class="body" x="117" y="670">案件、確認版本、回執與操作紀錄</text><rect class="box" x="645" y="598" width="460" height="94" rx="10"/><text class="label" x="667" y="636">私有附件</text><text class="body" x="667" y="670">與後端同一台 GCP VM</text><text class="note" x="48" y="738">模擬協作：未串接正式身分認證、政府送件或院所預約 API</text></svg>