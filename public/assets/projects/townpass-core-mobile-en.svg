<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">How far can a delegate help</tspan><tspan x="28" dy="37.12">, and who confirms the</tspan><tspan x="28" dy="37.12">request?</tspan></text>
<rect x="76" y="162.36" width="352" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="193.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">Applicant → delegate</tspan></text><text x="91" y="221.52" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Authorize a specific application</tspan><tspan x="91" dy="25.6">or booking scope</tspan></text><circle cx="43" cy="186.36" r="14" fill="#0d5e55"/><text x="38" y="192.36" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">1</tspan></text><path d="M43 202.36V296.72" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="288.72" width="352" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="319.72" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">Delegate → applicant</tspan></text><text x="91" y="347.88000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Prepare the material and return it</tspan><tspan x="91" dy="25.6">for approval</tspan></text><circle cx="43" cy="312.72" r="14" fill="#0d5e55"/><text x="38" y="318.72" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">2</tspan></text><path d="M43 328.72V423.08000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="415.08000000000004" width="352" height="138.96" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="91" y="446.08000000000004" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="91" dy="0">Delegate → simulated service</tspan></text><text x="91" y="474.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Only the applicant-approved</tspan><tspan x="91" dy="25.6">content can be submitted in the</tspan><tspan x="91" dy="25.6">simulation</tspan></text><circle cx="43" cy="439.08000000000004" r="14" fill="#0d5e55"/><text x="38" y="445.08000000000004" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">3</tspan></text>
