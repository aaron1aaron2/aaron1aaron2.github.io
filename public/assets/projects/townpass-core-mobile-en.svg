<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 678" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How far can a delegate help, and who confirms the request?</title><desc id="desc">The finalist demo was a simulation. Identity verification and government integration remain untested. Applicant → delegate: Authorize a specific application or booking scope Delegate → applicant: Prepare the material and return it for approval Delegate → simulated service: Only the applicant-approved content can be submitted in the simulation</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
