<text x="40" y="178.36" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">Scope</tspan></text><text x="197" y="178.36" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="197" dy="0">Question to</tspan><tspan x="197" dy="21.76">resolve</tspan></text><path d="M28 214.88000000000002H428" stroke="#a7babb"/><path d="M179 214.88000000000002V369.28000000000003" stroke="#a7babb"/><text x="40" y="243.88000000000002" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Control</tspan><tspan x="40" dy="28.16">plane</tspan></text><text x="197" y="243.88000000000002" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Which operations</tspan><tspan x="197" dy="26.88">and management</tspan><tspan x="197" dy="26.88">responsibilities</tspan><tspan x="197" dy="26.88">belong to each party</tspan><tspan x="197" dy="26.88">?</tspan></text><path d="M28 369.28000000000003H428" stroke="#a7babb"/><path d="M179 369.28000000000003V469.92" stroke="#a7babb"/><text x="40" y="398.28000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Data plane</tspan></text><text x="197" y="398.28000000000003" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">What interfaces and</tspan><tspan x="197" dy="26.88">checks apply to data</tspan><tspan x="197" dy="26.88">handoffs?</tspan></text><path d="M28 469.92H428" stroke="#a7babb"/><path d="M179 469.92V597.44" stroke="#a7babb"/><text x="40" y="498.92" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Device</tspan><tspan x="40" dy="28.16">layer</tspan></text><text x="197" y="498.92" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Which device</tspan><tspan x="197" dy="26.88">integration tasks</tspan><tspan x="197" dy="26.88">have an owner and</tspan><tspan x="197" dy="26.88">deliverable?</tspan></text><path d="M28 597.44H428" stroke="#a7babb"/>
