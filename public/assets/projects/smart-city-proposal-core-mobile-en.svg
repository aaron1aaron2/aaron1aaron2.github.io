<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 696" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Turn cross-company dependencies into reviewable commitments</title><desc id="desc">The deliverable was a draft proposal that was never submitted. Control plane: Which operations and management responsibilities belong to each party? Data plane: What interfaces and checks apply to data handoffs? Device layer: Which device integration tasks have an owner and deliverable?</desc>
