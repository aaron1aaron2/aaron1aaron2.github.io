<title id="title">Retain event history and analyze selected waveforms</title><desc id="desc">Waveform analysis covers the selected event windows. Full event history: Keep the event history searchable Selected waveform files: Agree on device and event-window scope Batch signal analysis: Link waveforms, plots and notes to each event Analysis report: Manually review figures and interpretations Repeatable handoff: Retain scope, formats and processing steps</desc>
