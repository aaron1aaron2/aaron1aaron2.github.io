<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 605" role="img" aria-labelledby="title desc"><title id="title">託你辦協作流程</title><desc id="desc">本人建案、代辦準備、本人確認或退回，然後模擬送出。</desc><rect width="1200" height="605" fill="#f6f4ee"/><style>text{font-family:'Microsoft JhengHei',sans-serif;fill:#253b34}.title{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.note{font-size:18px;fill:#536960}.box{fill:#fff;stroke:#8ca499;stroke-width:2}.arrow{fill:none;stroke:#46745e;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#46745e" stroke-width="1.5"/></marker></defs><text class="title" x="48" y="55">一次案件，兩個角色，最後確認留給本人</text><text class="note" x="48" y="94">決賽流程示意；畫面與名額、回執為模擬</text><rect class="box" x="48" y="150" width="250" height="132" rx="10"/><text class="label" x="70" y="188">01 本人建立案件</text><text class="body" x="70" y="222">分享短效接手連結</text><path class="arrow" d="M301 216h31"/><rect class="box" x="338" y="150" width="250" height="132" rx="10"/><text class="label" x="360" y="188">02 代辦領取並準備</text><text class="body" x="360" y="222">填寫內容及範例附件</text><path class="arrow" d="M591 216h31"/><rect class="box" x="628" y="150" width="250" height="132" rx="10"/><text class="label" x="650" y="188">03 本人查看摘要</text><text class="body" x="650" y="222">確認，或退回修改</text><path class="arrow" d="M881 216h31"/><rect class="box" x="918" y="150" width="250" height="132" rx="10"/><text class="label" x="940" y="188">04 代辦模擬送出</text><text class="body" x="940" y="222">兩端查看同一份回執</text><path class="arrow" d="M750 285V355H460V287"/><text class="body" x="475" y="390">退回或修改內容 → 舊確認失效 → 再次確認</text><rect x="48" y="440" width="1104" height="115" rx="10" fill="#e7eee8"/><text class="label" x="72" y="481">本人可查看紀錄，並停止後續協助</text><text class="body" x="72" y="521">停止不會自動撤回已提交內容；送出重試以同一案件與回執處理</text></svg>