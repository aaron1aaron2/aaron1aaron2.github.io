<text x="535" y="385" fill="#52636d" font-size="16"><tspan x="535" dy="0">需要修改</tspan></text>
<rect x="176" y="388" width="76" height="23.48" fill="#fff"/>
<text x="180" y="405" fill="#52636d" font-size="16"><tspan x="180" dy="0">重新準備</tspan></text>
