<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 770" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">託你辦：準備、確認與模擬送出</title><desc id="desc">決賽範圍：單次、一案、一位代辦；停止後續權限不等於取消既有提交。 實線表示資料或處理流程；虛線表示審查、條件或回饋。</desc>
<defs><marker id="townpass-flow-zh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#526773"/></marker></defs>
<rect width="1040" height="770" fill="#fff"/>
<g font-family="Arial,Microsoft JhengHei,sans-serif">
<text x="40" y="48" fill="#172e3b" font-size="29" font-weight="600"><tspan x="40" dy="0">託你辦：準備、確認與模擬送出</tspan></text>
<text x="40" y="82" fill="#61717a" font-size="17"><tspan x="40" dy="0">實線：資料／處理流程　　虛線：審查／回饋</tspan></text>
<path d="M40 103H1000" stroke="#ccd5da"/>
