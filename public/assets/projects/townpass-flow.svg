<path d="M395 502H165V315" fill="none" stroke="#526773" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#townpass-flow-zh)"/>
<rect x="40" y="190" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="55" y="244.76" fill="#172e3b" font-size="22" font-weight="600"><tspan x="55" dy="0">代辦準備資料</tspan></text>
<text x="55" y="276.91999999999996" fill="#52636d" font-size="19"><tspan x="55" dy="0">填寫資料與整理附件</tspan></text>
<rect x="395" y="190" width="250" height="125" rx="3" fill="#fff" stroke="#8c6b37" stroke-width="2"/>
<text x="410" y="244.76" fill="#71572b" font-size="22" font-weight="600"><tspan x="410" dy="0">本人檢視與確認</tspan></text>
<text x="410" y="276.91999999999996" fill="#52636d" font-size="19"><tspan x="410" dy="0">確認綁定案件 revision</tspan></text>
<rect x="750" y="190" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="765" y="232.6" fill="#172e3b" font-size="22" font-weight="600"><tspan x="765" dy="0">代辦模擬送出</tspan></text>
<text x="765" y="264.76" fill="#52636d" font-size="19"><tspan x="765" dy="0">idempotency key 避免重</tspan><tspan x="765" dy="24.32">複</tspan></text>
<rect x="395" y="445" width="250" height="125" rx="3" fill="#fff" stroke="#8c6b37" stroke-width="2"/>
<text x="410" y="487.6" fill="#71572b" font-size="22" font-weight="600"><tspan x="410" dy="0">修改後重新確認</tspan></text>
<text x="410" y="519.76" fill="#52636d" font-size="19"><tspan x="410" dy="0">表單或附件變更使舊確認</tspan><tspan x="410" dy="24.32">失效</tspan></text>
<rect x="750" y="445" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
