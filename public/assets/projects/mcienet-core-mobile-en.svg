<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 912" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How can DNA sequences predict chromatin interactions?</title><desc id="desc">Part of preprocessing derives from ChINN. The figure summarizes the research method. Local patterns: Use multiscale convolution to capture short-range features Broader sequence context: Represent the sequence pair at multiple scales Combine paired representations: Estimate interaction from the paired features Ablation and cross-dataset tests: Assess scale choices and dataset dependence Model interpretation: Inspect which sequence regions influence the model</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="912" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">How can DNA sequences</tspan><tspan x="28" dy="37.12">predict chromatin</tspan><tspan x="28" dy="37.12">interactions?</tspan></text>
<text x="28" y="176.36" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">Sequence features</tspan></text><rect x="28" y="190.36" width="194" height="195.28000000000003" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="221.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Local patterns</tspan></text><text x="43" y="249.52" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Use multiscale</tspan><tspan x="43" dy="25.6">convolution to</tspan><tspan x="43" dy="25.6">capture short-</tspan><tspan x="43" dy="25.6">range features</tspan></text><rect x="234" y="190.36" width="194" height="195.28000000000003" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="221.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">Broader</tspan><tspan x="249" dy="28.16">sequence</tspan><tspan x="249" dy="28.16">context</tspan></text><text x="249" y="305.84000000000003" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">Represent the</tspan><tspan x="249" dy="25.6">sequence pair at</tspan><tspan x="249" dy="25.6">multiple scales</tspan></text><path d="M125 385.64000000000004V399.64000000000004H331V385.64000000000004" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 399.64000000000004V419.64000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="419.64000000000004" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="450.64000000000004" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">Combine paired representations</tspan></text><text x="43" y="478.80000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Estimate interaction from the paired</tspan><tspan x="43" dy="25.6">features</tspan></text><path d="M228 533V547H125V567" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 547H331V567" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="567" width="194" height="220.88" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="598" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Ablation and</tspan><tspan x="43" dy="28.16">cross-dataset</tspan><tspan x="43" dy="28.16">tests</tspan></text><text x="43" y="682.48" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Assess scale</tspan><tspan x="43" dy="25.6">choices and</tspan><tspan x="43" dy="25.6">dataset</tspan><tspan x="43" dy="25.6">dependence</tspan></text><rect x="234" y="567" width="194" height="220.88" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="598" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">Model</tspan><tspan x="249" dy="28.16">interpretation</tspan></text><text x="249" y="654.32" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">Inspect which</tspan><tspan x="249" dy="25.6">sequence</tspan><tspan x="249" dy="25.6">regions</tspan><tspan x="249" dy="25.6">influence the</tspan><tspan x="249" dy="25.6">model</tspan></text>
<path d="M28 812.88H428" stroke="#a7babb"/><text x="28" y="837.88" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">Part of preprocessing derives from</tspan><tspan x="28" dy="25.6">ChINN. The figure summarizes the</tspan><tspan x="28" dy="25.6">research method.</tspan></text>
