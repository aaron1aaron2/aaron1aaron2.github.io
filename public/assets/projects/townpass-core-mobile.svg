<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 513" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">代辦能協助到哪裡，誰做最後決定？</title><desc id="desc">決賽為提案與模擬，正式身分認證及政府介接待驗證。 本人 → 代辦: 授權特定申辦或預約範圍 代辦 → 本人: 代辦準備資料並交回本人確認 代辦 → 模擬服務: 只有本人已確認的內容可以模擬送出</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="513" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">代辦能協助到哪裡，誰做最後</tspan><tspan x="28" dy="37.12">決定？</tspan></text>
<rect x="76" y="125.24" width="352" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">本人 → 代辦</tspan></text><text x="91" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">授權特定申辦或預約範圍</tspan></text><circle cx="43" cy="149.24" r="14" fill="#0d5e55"/><text x="38" y="155.24" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">1</tspan></text><path d="M43 165.24V234" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="226" width="352" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="257" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">代辦 → 本人</tspan></text><text x="91" y="285.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">代辦準備資料並交回本人確認</tspan></text><circle cx="43" cy="250" r="14" fill="#0d5e55"/><text x="38" y="256" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">2</tspan></text><path d="M43 266V334.76" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="326.76" width="352" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="91" y="357.76" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="91" dy="0">代辦 → 模擬服務</tspan></text><text x="91" y="385.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">只有本人已確認的內容可以模擬送出</tspan></text><circle cx="43" cy="350.76" r="14" fill="#0d5e55"/><text x="38" y="356.76" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">3</tspan></text>
<path d="M28 439.52H428" stroke="#a7babb"/><text x="28" y="464.52" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">決賽為提案與模擬，正式身分認證及政府介接</tspan><tspan x="28" dy="25.6">待驗證。</tspan></text>
</g></svg>
