<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 497" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">同一設備需要四種診斷判讀</title><desc id="desc">資料不足時降級結論，保留仍能支持的判讀。 當時有運轉嗎？: 先以運轉偵測限定分析樣本。 可能是哪種異常？: 核對波形特徵與資料涵蓋。 異常有多嚴重？: 先定義異常比例的分母。 何時可能劣化？: 剩餘壽命需有足夠趨勢才能外推。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="497" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">同一設備需要四種診斷判讀</tspan></text>
<text x="40" y="104.12" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">判讀問題</tspan></text><text x="197" y="104.12" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="197" dy="0">依據與界線</tspan></text><path d="M28 118.88000000000001H428" stroke="#a7babb"/><path d="M179 118.88000000000001V195.2" stroke="#a7babb"/><text x="40" y="147.88" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">當時有運轉嗎</tspan><tspan x="40" dy="28.16">？</tspan></text><text x="197" y="147.88" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">先以運轉偵測限定分析</tspan><tspan x="197" dy="26.88">樣本。</tspan></text><path d="M28 195.2H428" stroke="#a7babb"/><path d="M179 195.2V271.52" stroke="#a7babb"/><text x="40" y="224.2" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">可能是哪種異</tspan><tspan x="40" dy="28.16">常？</tspan></text><text x="197" y="224.2" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">核對波形特徵與資料涵</tspan><tspan x="197" dy="26.88">蓋。</tspan></text><path d="M28 271.52H428" stroke="#a7babb"/><path d="M179 271.52V347.84" stroke="#a7babb"/><text x="40" y="300.52" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">異常有多嚴重</tspan><tspan x="40" dy="28.16">？</tspan></text><text x="197" y="300.52" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">先定義異常比例的分母</tspan><tspan x="197" dy="26.88">。</tspan></text><path d="M28 347.84H428" stroke="#a7babb"/><path d="M179 347.84V424.15999999999997" stroke="#a7babb"/><text x="40" y="376.84" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">何時可能劣化</tspan><tspan x="40" dy="28.16">？</tspan></text><text x="197" y="376.84" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">剩餘壽命需有足夠趨勢</tspan><tspan x="197" dy="26.88">才能外推。</tspan></text><path d="M28 424.15999999999997H428" stroke="#a7babb"/>
<path d="M28 449.15999999999997H428" stroke="#a7babb"/><text x="28" y="474.15999999999997" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">資料不足時降級結論，保留仍能支持的判讀。</tspan></text>
</g></svg>
