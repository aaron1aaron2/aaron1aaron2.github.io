<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">Why represent the same</tspan><tspan x="28" dy="37.12">station differently over time</tspan><tspan x="28" dy="37.12">?</tspan></text>
<text x="40" y="178.36" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">Comparison</tspan></text><text x="197" y="178.36" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="197" dy="0">Use in</tspan><tspan x="197" dy="21.76">forecasting</tspan></text><path d="M28 214.88000000000002H428" stroke="#a7babb"/><path d="M179 214.88000000000002V342.40000000000003" stroke="#a7babb"/><text x="40" y="243.88000000000002" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Fixed</tspan><tspan x="40" dy="28.16">station</tspan><tspan x="40" dy="28.16">features</tspan></text><text x="197" y="243.88000000000002" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Use the same station</tspan><tspan x="197" dy="26.88">features over time as</tspan><tspan x="197" dy="26.88">a point of</tspan><tspan x="197" dy="26.88">comparison.</tspan></text><path d="M28 342.40000000000003H428" stroke="#a7babb"/><path d="M179 342.40000000000003V469.92" stroke="#a7babb"/><text x="40" y="371.40000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Dynamic</tspan><tspan x="40" dy="28.16">station</tspan><tspan x="40" dy="28.16">embeddings</tspan></text><text x="197" y="371.40000000000003" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Learn changing</tspan><tspan x="197" dy="26.88">station relationships</tspan><tspan x="197" dy="26.88">and feed them to the</tspan><tspan x="197" dy="26.88">flow model.</tspan></text><path d="M28 469.92H428" stroke="#a7babb"/><path d="M179 469.92V597.44" stroke="#a7babb"/><text x="40" y="498.92" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Evaluation</tspan></text><text x="197" y="498.92" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">Use passenger-flow</tspan><tspan x="197" dy="26.88">experiments to test</tspan><tspan x="197" dy="26.88">where the method</tspan><tspan x="197" dy="26.88">applies.</tspan></text><path d=