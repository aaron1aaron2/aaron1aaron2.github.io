<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 696" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Why represent the same station differently over time?</title><desc id="desc">The figure explains the modeling choice. The study reports the empirical results. Fixed station features: Use the same station features over time as a point of comparison. Dynamic station embeddings: Learn changing station relationships and feed them to the flow model. Evaluation: Use passenger-flow experiments to test where the method applies.</desc>
