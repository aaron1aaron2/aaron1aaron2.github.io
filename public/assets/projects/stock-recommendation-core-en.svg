<title id="title">Connect stock recommendations to a usable interface</title><desc id="desc">The features were prototyped. Adoption and trading outcomes were unmeasured. Financial attributes: Characterize stocks with company data User behavior: Explore browsing, subscriptions and co-occurrence Integrate team modules: Connect team recommendation sources to the Telegram bot I built Interactive queries: Return information through chat Subscription updates: Send automated updates in the prototype</desc>
