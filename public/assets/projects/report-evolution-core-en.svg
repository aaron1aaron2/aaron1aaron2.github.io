="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">Separate</tspan><tspan x="276" dy="28.16">evidence from</tspan><tspan x="276" dy="28.16">narrative</tspan></text><text x="276" y="355.36" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">Testable nodes</tspan><tspan x="276" dy="25.6">produce</tspan><tspan x="276" dy="25.6">findings. The</tspan><tspan x="276" dy="25.6">LLM organizes</tspan><tspan x="276" dy="25.6">the wording.</tspan></text><rect x="494" y="163.68" width="198" height="218.32" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="194.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">Platform</tspan><tspan x="509" dy="28.16">dispatch and</tspan><tspan x="509" dy="28.16">download</tspan></text><text x="509" y="279.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">Dispatch work</tspan><tspan x="509" dy="25.6">and deliver</tspan><tspan x="509" dy="25.6">DOCX</tspan></text><rect x="494" y="398" width="198" height="164.56" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="429" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">Trace findings</tspan></text><text x="509" y="457.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">Keep</tspan><tspan x="509" dy="25.6">intermediate</tspan><tspan x="509" dy="25.6">artifacts for</tspan><tspan x="509" dy="25.6">review</tspan></text>
