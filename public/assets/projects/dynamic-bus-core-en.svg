<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 664" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How can visitor demand inform routes and schedules?</title><desc id="desc">Demand is estimated from proxy signals. Actual ridership and operations remain unverified. Demand signals: Visitor counts, search interest and popularity by hour Attraction distances: Build grouped point-to-point distance matrices Time profiles and routes: Allocate monthly traffic by day and hour, then explore TSP routes Spatial options: Inspect routes on a map Time-based options: Compare timetables and passenger flows</desc>
