<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 621" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Four distinct questions in machine diagnosis</title><desc id="desc">When evidence is limited, retain only the conclusions it can support. Was the machine running?: Identify operating intervals before selecting samples. What kind of anomaly is present?: Check waveform features and coverage. How severe is it?: Define the denominator of the anomaly rate. When might degradation matter?: Remaining-life estimates need sufficient trend data.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="621" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">Four distinct questions in machine</tspan><tspan x="28" dy="40.96">diagnosis</tspan></text>
<text x="40" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">Diagnostic question</tspan></text><text x="266" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="266" dy="0">Evidence and limits</tspan></text><path d="M28 163.68H692" stroke="#a7babb"/><path d="M248 163.68V240" stroke="#a7babb"/><text x="40" y="192.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Was the machine</tspan><tspan x="40" dy="28.16">running?</tspan></text><text x="266" y="192.68" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">Identify operating intervals before</tspan><tspan x="266" dy="26.88">selecting samples.</tspan></text><path d="M28 240H692" stroke="#a7babb"/><path d="M248 240V344.48" stroke="#a7babb"/><text x="40" y="269" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">What kind of</tspan><tspan x="40" dy="28.16">anomaly is present</tspan><tspan x="40" dy="28.16">?</tspan></text><text x="266" y="269" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">Check waveform features and coverage.</tspan></text><path d="M28 344.48H692" stroke="#a7babb"/><path d="M248 344.48V418.24" stroke="#a7babb"/><text x="40" y="373.48" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">How severe is it?</tspan></text><text x="266" y="373.48" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">Define the denominator of the anomaly</tspan><tspan x="266" dy="26.88">rate.</tspan></text><path d="M28 418.24H692" stroke="#a7babb"/><path d="M248 418.24V522.72" stroke="#a7babb"/><text x="40" y="447.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">When might</tspan><tspan x="40" dy="28.16">degradation matter</tspan><tspan x="40" dy="28.16">?</tspan></text><text x="266" y="447.24" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">Remaining-life estimates need</tspan><tspan x="266" dy="26.88">sufficient trend data.</tspan></text><path d="M28 522.72H692" stroke="#a7babb"/>
<path d="M28 547.72H692" stroke="#a7babb"/><text x="28" y="572.72" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">When evidence is limited, retain only the conclusions it can</tspan><tspan x="28" dy="25.6">support.</tspan></text>
