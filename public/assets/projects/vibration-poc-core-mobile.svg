<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 533" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">在哪些條件下，振動資料足以支撐診斷？</title><desc id="desc">場域驗證用於判斷可行性及導入條件。 確認輸入: 對齊設備背景、波形涵蓋與有效運轉區間 逐段驗證: 依序核對運轉偵測、異常、嚴重度與壽命分析 限制報告結論: 保存中間產物與適用條件</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="533" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">在哪些條件下，振動資料足以</tspan><tspan x="28" dy="37.12">支撐診斷？</tspan></text>
<rect x="28" y="125.24" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">確認輸入</tspan></text><text x="43" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">對齊設備背景、波形涵蓋與有效運轉區間</tspan></text><path d="M228 213V236" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="236" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="267" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">逐段驗證</tspan></text><text x="43" y="295.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">依序核對運轉偵測、異常、嚴重度與壽命</tspan><tspan x="43" dy="25.6">分析</tspan></text><path d="M228 349.36V372.36" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="372.36" width="400" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="403.36" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">限制報告結論</tspan></text><text x="43" y="431.52000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">保存中間產物與適用條件</tspan></text>
<path d="M28 485.12H428" stroke="#a7babb"/><text x="28" y="510.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">場域驗證用於判斷可行性及導入條件。</tspan></text>
</g></svg>
