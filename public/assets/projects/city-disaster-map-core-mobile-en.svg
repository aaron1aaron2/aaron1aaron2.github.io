<title id="title">Two spatial scales for comparing emergency resources</title><desc id="desc">I defined the analytical questions and proposal. The team used public data for the final demo. District × population: How are facilities and shelter capacity distributed relative to population? Attraction × nearby facilities: Which attractions have more or fewer nearby emergency resources?</desc>
