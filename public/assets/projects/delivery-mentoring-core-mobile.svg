<title id="title">交付承諾與研究探索怎麼各自追蹤？</title><desc id="desc">本人負責交付範圍與產品採納判斷，研究成果保留作者歸屬。 跨程式庫交付: 將需求、分工與驗證連到共用清單，回查交付狀態。 實習研究: 另訂題目、教材及進度；產品是否採用由驗證與責任判斷。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="456" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">交付承諾與研究探索怎麼各自</tspan><tspan x="28" dy="37.12">追蹤？</tspan></text>
<text x="40" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">工作類型</tspan></text><text x="197" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="197" dy="0">安排與決策</tspan></text><path d="M28 156H428" stroke="#a7babb"/><path d="M179 156V256.64" stroke="#a7babb"/><text x="40" y="185" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">跨程式庫交付</tspan></text><text x="197" y="185" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">將需求、分工與驗證連</tspan><tspan x="197" dy="26.88">到共用清單，回查交付</tspan><tspan x="197" dy="26.88">狀態。</tspan></text><path d="M28 256.64H428" stroke="#a7babb"/><path d="M179 256.64V357.28" stroke="#a7babb"/><text x="40" y="285.64" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">實習研究</tspan></text><text x="197" y="285.64" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">另訂題目、教材及進度</tspan><tspan x="197" dy="26.88">；產品是否採用由驗證</tspan><tspan x="197" dy="26.88">與責任判斷。</tspan></text><path d="M28 357.28H428" stroke="#a7babb"/>
