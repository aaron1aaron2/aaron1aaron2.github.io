<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 439" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">從設備訊號到維護判斷</title><desc id="desc">核心設計是讓操作員從告警回查證據，並看清楚結果涵蓋哪些資料。 持續監測: 特徵、即時狀態與告警 事件與波形: 自動排程、手動要求與原始波形 工作流協調: 檢查資料就緒、派工，分別記錄任務與資料涵蓋 回查設備與事件: 趨勢、振動、局放與處理紀錄 支援維護判斷: 剩餘壽命推估、閾值與可回查報告</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="439" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">從設備訊號到維護判斷</tspan></text>
<text x="28" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">資料與觸發</tspan></text><text x="261" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="261" dy="0">平台協調</tspan></text><text x="494" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="494" dy="0">操作與判讀</tspan></text><path d="M226 179.4H243.5V308.76H226" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M243.5 244.08000000000004H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 244.08000000000004H476.5V179.4H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M476.5 244.08000000000004V308.76H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="122.72000000000001" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">持續監測</tspan></text><text x="43" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">特徵、即時狀態與</tspan><tspan x="43" dy="25.6">告警</tspan></text><rect x="28" y="252.08" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="283.08000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">事件與波形</tspan></text><text x="43" y="311.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">自動排程、手動要</tspan><tspan x="43" dy="25.6">求與原始波形</tspan></text><rect x="261" y="174.60000000000002" width="198" height="138.96" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="276" y="205.60000000000002" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">工作流協調</tspan></text><text x="276" y="233.76000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">檢查資料就緒、派</tspan><tspan x="276" dy="25.6">工，分別記錄任務</tspan><tspan x="276" dy="25.6">與資料涵蓋</tspan></text><rect x="494" y="122.72000000000001" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">回查設備與事件</tspan></text><text x="509" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">趨勢、振動、局放</tspan><tspan x="509" dy="25.6">與處理紀錄</tspan></text><rect x="494" y="252.08" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="283.08000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">支援維護判斷</tspan></text><text x="509" y="311.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">剩餘壽命推估、閾</tspan><tspan x="509" dy="25.6">值與可回查報告</tspan></text>
<path d="M28 390.44H692" stroke="#a7babb"/><text x="28" y="415.44" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">核心設計是讓操作員從告警回查證據，並看清楚結果涵蓋哪些資料。</tspan></text>
