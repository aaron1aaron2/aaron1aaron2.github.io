<path d="M645 477H750" fill="none" stroke="#526773" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pd-event-analysis-en)"/>
<rect x="40" y="155" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="55" y="197.6" fill="#172e3b" font-size="22" font-weight="600"><tspan x="55" dy="0">Event arrival order</tspan></text>
<text x="55" y="229.76" fill="#52636d" font-size="19"><tspan x="55" dy="0">Resume by event ID,</tspan><tspan x="55" dy="24.32">not event time</tspan></text>
<rect x="395" y="155" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="410" y="197.6" fill="#172e3b" font-size="22" font-weight="600"><tspan x="410" dy="0">Event-time window</tspan></text>
<text x="410" y="229.76" fill="#52636d" font-size="19"><tspan x="410" dy="0">Locate waveform sets</tspan><tspan x="410" dy="24.32">per sensor</tspan></text>
<rect x="750" y="155" width="250" height="125" rx="3" fill="#fff" stroke="#8c6b37" stroke-width="2"/>
<text x="765" y="187.42" fill="#71572b" font-size="19.5" font-weight="600"><tspan x="765" dy="0">Wait for a stable file</tspan><tspan x="765" dy="24.96">set</tspan></text>
<text x="765" y="241.34" fill="#52636d" font-size="16.5"><tspan x="765" dy="0">Allow waveforms to arrive</tspan><tspan x="765" dy="21.12">incrementally</tspan></text>
<rect x="395" y="420" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="410" y="462.6" fill="#172e3b" font-size="22" font-weight="600"><tspan x="410" dy="0">Execution result</tspan></text>
<text x="410" y="494.76000000000005" fill="#52636d" font-size="19"><tspan x="410" dy="0">Success, failure or</tspan><tspan x="410" dy="24.32">missing data</tspan></text>
<rect x="750" y="420" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="765" y="462.6" fill="#172e3b" font-size="22" font-weight="600"><tspan x="765" dy="0">Data completeness</tspan></text>
<text x="765" y="494.76000000000005" fill="#52636d" font-size="19"><tspan x="765" dy="0">Complete, partial or</tspan><tspan x="765" dy="24.32">missing</tspan></text>
<rect x="40" y="420" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="55" y="452.42" fill="#172e3b" font-size="19.5" font-weight="600"><tspan x="55" dy="0">Dispatch PRPD</tspan><tspan x="55" dy="24.96">analysis</tspan></text>
<text x="55" y="506.34" fill="#52636d" font-size="16.5"><tspan x="55" dy="0">Execute independently per</tspan><tspan x="55" dy="21.12">sensor</tspan></text>
<rect x="176" y="363" width="205.11999999999998" height="23.48" fill="#fff"/>
<text x="180" y="380" fill="#52636d" font-size="16"><tspan x="180" dy="0">Dispatch conditions met</tspan></text>
<rect x="661" y="373" width="139.36" height="23.48" fill="#fff"/>
<text x="665" y="390" fill="#52636d" font-size="16"><tspan x="665" dy="0">Report together</tspan></text>
