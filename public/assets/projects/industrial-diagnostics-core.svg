<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">同一設備需要四種診斷判讀</title><desc id="desc">資料不足時降級結論，保留仍能支持的判讀。 當時有運轉嗎？: 先以運轉偵測限定分析樣本。 可能是哪種異常？: 核對波形特徵與資料涵蓋。 異常有多嚴重？: 先定義異常比例的分母。 何時可能劣化？: 剩餘壽命需有足夠趨勢才能外推。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="388" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">同一設備需要四種診斷判讀</tspan></text>
<text x="40" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">判讀問題</tspan></text><text x="266" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="266" dy="0">依據與界線</tspan></text><path d="M28 122.72000000000001H692" stroke="#a7babb"/><path d="M248 122.72000000000001V170.88" stroke="#a7babb"/><text x="40" y="151.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">當時有運轉嗎？</tspan></text><text x="266" y="151.72000000000003" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">先以運轉偵測限定分析樣本。</tspan></text><path d="M28 170.88H692" stroke="#a7babb"/><path d="M248 170.88V219.04" stroke="#a7babb"/><text x="40" y="199.88" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">可能是哪種異常？</tspan></text><text x="266" y="199.88" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">核對波形特徵與資料涵蓋。</tspan></text><path d="M28 219.04H692" stroke="#a7babb"/><path d="M248 219.04V267.2" stroke="#a7babb"/><text x="40" y="248.04" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">異常有多嚴重？</tspan></text><text x="266" y="248.04" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">先定義異常比例的分母。</tspan></text><path d="M28 267.2H692" stroke="#a7babb"/><path d="M248 267.2V315.36" stroke="#a7babb"/><text x="40" y="296.2" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">何時可能劣化？</tspan></text><text x="266" y="296.2" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">剩餘壽命需有足夠趨勢才能外推。</tspan></text><path d="M28 315.36H692" stroke="#a7babb"/>
<path d="M28 340.36H692" stroke="#a7babb"/><text x="28" y="365.36" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">資料不足時降級結論，保留仍能支持的判讀。</tspan></text>
</g></svg>
