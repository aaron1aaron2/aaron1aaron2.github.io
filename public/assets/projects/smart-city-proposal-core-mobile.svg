<title id="title">把跨公司依賴變成可查核的提案</title><desc id="desc">成果為未送件的提案草案。 控制面: 哪些操作與管理責任由各方承接？ 資料面: 交接資料時，介面與檢核條件是什麼？ 裝置端: 哪些裝置整合工作有明確責任與產物？</desc>
