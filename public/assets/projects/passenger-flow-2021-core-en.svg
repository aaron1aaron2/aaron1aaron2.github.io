<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">Why represent the same station differently</tspan><tspan x="28" dy="40.96">over time?</tspan></text>
<text x="40" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">Comparison</tspan></text><text x="266" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="266" dy="0">Use in forecasting</tspan></text><path d="M28 163.68H692" stroke="#a7babb"/><path d="M248 163.68V240" stroke="#a7babb"/><text x="40" y="192.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Fixed station</tspan><tspan x="40" dy="28.16">features</tspan></text><text x="266" y="192.68" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">Use the same station features over time</tspan><tspan x="266" dy="26.88">as a point of comparison.</tspan></text><path d="M28 240H692" stroke="#a7babb"/><path d="M248 240V316.32" stroke="#a7babb"/><text x="40" y="269" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Dynamic station</tspan><tspan x="40" dy="28.16">embeddings</tspan></text><text x="266" y="269" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">Learn changing station relationships</tspan><tspan x="266" dy="26.88">and feed them to the flow model.</tspan></text><path d="M28 316.32H692" stroke="#a7babb"/><path d="M248 316.32V390.08" stroke="#a7babb"/><text x="40" y="345.32" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">Evaluation</tspan></text><text x="266" y="345.32" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">Use passenger-flow experiments to test</tspan><tspan x="266" dy="26.88">where the method applies.</tspan></text><path d="M28 390.08H692" stroke="#a7babb"/>
<path d="M28 415.08H692" stroke="#a7babb"/><text x="28" y="440.08" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">The figure explains the modeling choice. The study reports the</tspan><tspan x="28" dy="25.6">empirical results.</tspan></text>
