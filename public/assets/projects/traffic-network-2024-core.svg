<title id="title">如何把捷運網路關係交給預測模型？</title><desc id="desc">圖為團隊方法，個人角色為程式碼與技術支援。 遮蔽流量: 從流量訊號學習時間情境 關係與距離: 從車站關係及距離學習空間結構 分層整合: 組合時間、車站與路線訊號 流量預測: 以團隊實驗評估方法 研究發表: Knowledge-Based Systems</desc>
