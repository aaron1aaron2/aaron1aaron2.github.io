<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 391" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">同一個車站，為何需要不同時段的表示？</title><desc id="desc">圖中說明模型表示的差異，成效以論文實驗為準。 固定車站表示: 每個時段沿用同一組車站特徵，作為比較觀點。 動態車站嵌入: 學習時變的車站關係，將表示送入下游流量模型。 方法驗證: 用流量估計實驗檢驗其適用範圍。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="391" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">同一個車站，為何需要不同時段的表示？</tspan></text>
<text x="40" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">比較項</tspan></text><text x="266" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="266" dy="0">如何用於預測</tspan></text><path d="M28 122.72000000000001H692" stroke="#a7babb"/><path d="M248 122.72000000000001V196.48000000000002" stroke="#a7babb"/><text x="40" y="151.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">固定車站表示</tspan></text><text x="266" y="151.72000000000003" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">每個時段沿用同一組車站特徵，作為比較觀</tspan><tspan x="266" dy="26.88">點。</tspan></text><path d="M28 196.48000000000002H692" stroke="#a7babb"/><path d="M248 196.48000000000002V270.24" stroke="#a7babb"/><text x="40" y="225.48000000000002" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">動態車站嵌入</tspan></text><text x="266" y="225.48000000000002" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">學習時變的車站關係，將表示送入下游流量</tspan><tspan x="266" dy="26.88">模型。</tspan></text><path d="M28 270.24H692" stroke="#a7babb"/><path d="M248 270.24V318.4" stroke="#a7babb"/><text x="40" y="299.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">方法驗證</tspan></text><text x="266" y="299.24" fill="#455d66" font-size="21" font-weight="500"><tspan x="266" dy="0">用流量估計實驗檢驗其適用範圍。</tspan></text><path d="M28 318.4H692" stroke="#a7babb"/>
<path d="M28 343.4H692" stroke="#a7babb"/><text x="28" y="368.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">圖中說明模型表示的差異，成效以論文實驗為準。</tspan></text>
</g></svg>
