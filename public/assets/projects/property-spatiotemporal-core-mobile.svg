<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 634" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">如何預測區域交易價格與交易量？</title><desc id="desc">預測目標為區域指標。單筆估價需另行驗證。 月度交易: 由實價登錄彙整區域月度資訊 區域關係: 把空間及時間訊號納入比較 GMAN 實驗: 以第三方方法為基礎，建立模型並按區域評估 區域平均單位價: 比較不同分區的預測表現 交易量: 同時保留成交量的預測目標</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="634" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">如何預測區域交易價格與交易</tspan><tspan x="28" dy="37.12">量？</tspan></text>
<text x="28" y="139.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">區域訊號</tspan></text><rect x="28" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">月度交易</tspan></text><text x="43" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">由實價登錄彙整區</tspan><tspan x="43" dy="25.6">域月度資訊</tspan></text><rect x="234" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">區域關係</tspan></text><text x="249" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">把空間及時間訊號</tspan><tspan x="249" dy="25.6">納入比較</tspan></text><path d="M125 266.6V280.6H331V266.6" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 280.6V300.6" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="300.6" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="331.6" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">GMAN 實驗</tspan></text><text x="43" y="359.76000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">以第三方方法為基礎，建立模型並按區域</tspan><tspan x="43" dy="25.6">評估</tspan></text><path d="M228 413.96000000000004V427.96000000000004H125V447.96000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 427.96000000000004H331V447.96000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="447.96000000000004" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="478.96000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">區域平均單位價</tspan></text><text x="43" y="507.12000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">比較不同分區的預</tspan><tspan x="43" dy="25.6">測表現</tspan></text><rect x="234" y="447.96000000000004" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="478.96000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">交易量</tspan></text><text x="249" y="507.12000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">同時保留成交量的</tspan><tspan x="249" dy="25.6">預測目標</tspan></text>
<path d="M28 586.32H428" stroke="#a7babb"/><text x="28" y="611.32" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">預測目標為區域指標。單筆估價需另行驗證。</tspan></text>
</g></svg>
