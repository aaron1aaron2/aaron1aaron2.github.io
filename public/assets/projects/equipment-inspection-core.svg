<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 467" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">多機型如何逐件檢測</title><desc id="desc">第二階段軟體功能已驗收。第三階段以現場樣本驗證 OK／NG 判定。 量測計畫: 依機型定義階段與測點 基準庫: 錄製、確認並管理基準版本及門檻 工單與待測物: 工單採用計畫版本，待測物按測點量測並對照基準 OK／NG／無法判定: 缺少必要測點時轉人工複查 偏離定位: 回查偏離的階段、測點與特徵</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="467" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">多機型如何逐件檢測</tspan></text>
<text x="28" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">定義比較方法</tspan></text><text x="261" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="261" dy="0">逐件執行</tspan></text><text x="494" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="494" dy="0">保留判定依據</tspan></text><path d="M226 193.48000000000002H243.5V336.92H226" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M243.5 258.16H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 258.16H476.5V193.48000000000002H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M476.5 258.16V336.92H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="122.72000000000001" width="198" height="141.51999999999998" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">量測計畫</tspan></text><text x="43" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">依機型定義階段與</tspan><tspan x="43" dy="25.6">測點</tspan></text><rect x="28" y="280.24" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="311.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">基準庫</tspan></text><text x="43" y="339.40000000000003" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">錄製、確認並管理</tspan><tspan x="43" dy="25.6">基準版本及門檻</tspan></text><rect x="261" y="188.68" width="198" height="138.96" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="276" y="219.68" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">工單與待測物</tspan></text><text x="276" y="247.84" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">工單採用計畫版本</tspan><tspan x="276" dy="25.6">，待測物按測點量</tspan><tspan x="276" dy="25.6">測並對照基準</tspan></text><rect x="494" y="122.72000000000001" width="198" height="141.51999999999998" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">OK／NG／無法</tspan><tspan x="509" dy="28.16">判定</tspan></text><text x="509" y="210.04000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">缺少必要測點時轉</tspan><tspan x="509" dy="25.6">人工複查</tspan></text><rect x="494" y="280.24" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="311.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">偏離定位</tspan></text><text x="509" y="339.40000000000003" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">回查偏離的階段、</tspan><tspan x="509" dy="25.6">測點與特徵</tspan></text>
<path d="M28 418.6H692" stroke="#a7babb"/><text x="28" y="443.6" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">第二階段軟體功能已驗收。第三階段以現場樣本驗證 OK／NG 判定。</tspan></text>
</g></svg>
