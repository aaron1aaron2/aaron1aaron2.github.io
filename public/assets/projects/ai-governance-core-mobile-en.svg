<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 737" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How does parallel development preserve reviewable evidence?</title><desc id="desc">Changes stay traceable. People retain merge and release decisions. Requirements and tests → issue record: Record the issue, conditions, ownership and acceptance criteria Issue record → isolated branch: Develop and verify in parallel, logging changes and tests Verification evidence → human review: Review the PR, tests and limits before approval or revision</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="737" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">How does parallel</tspan><tspan x="28" dy="37.12">development preserve</tspan><tspan x="28" dy="37.12">reviewable evidence?</tspan></text>
<rect x="76" y="162.36" width="352" height="167.12" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="193.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">Requirements and tests →</tspan><tspan x="91" dy="28.16">issue record</tspan></text><text x="91" y="249.68" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Record the issue, conditions,</tspan><tspan x="91" dy="25.6">ownership and acceptance</tspan><tspan x="91" dy="25.6">criteria</tspan></text><circle cx="43" cy="186.36" r="14" fill="#0d5e55"/><text x="38" y="192.36" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">1</tspan></text><path d="M43 202.36V350.48" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="342.48" width="352" height="141.51999999999998" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="373.48" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">Issue record → isolated</tspan><tspan x="91" dy="28.16">branch</tspan></text><text x="91" y="429.8" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Develop and verify in parallel,</tspan><tspan x="91" dy="25.6">logging changes and tests</tspan></text><circle cx="43" cy="366.48" r="14" fill="#0d5e55"/><text x="38" y="372.48" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">2</tspan></text><path d="M43 382.48V505" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="497" width="352" height="141.51999999999998" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="91" y="528" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="91" dy="0">Verification evidence →</tspan><tspan x="91" dy="28.16">human review</tspan></text><text x="91" y="584.32" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Review the PR, tests and limits</tspan><tspan x="91" dy="25.6">before approval or revision</tspan></text><circle cx="43" cy="521" r="14" fill="#0d5e55"/><text x="38" y="527" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">3</tspan></text>
