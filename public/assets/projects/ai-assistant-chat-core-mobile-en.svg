<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 641" role="img" aria-labelledby="title desc" lang="en">
<title id="title">What should a tool-using assistant show?</title><desc id="desc">The UI review covered waiting states, citation rendering and exposure of internal context. User → chat: After a question, the interface shows work in progress Retrieval or tool → assistant: Check the knowledge audience and surface tool progress Assistant → user: Return the answer with understandable source information</desc>
