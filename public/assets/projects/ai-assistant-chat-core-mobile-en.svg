<path d="M28 541.92H428" stroke="#a7babb"/><text x="28" y="566.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">The UI review covered waiting states,</tspan><tspan x="28" dy="25.6">citation rendering and exposure of</tspan><tspan x="28" dy="25.6">internal context.</tspan></text>
