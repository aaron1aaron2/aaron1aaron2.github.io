<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 1059" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How can tracking reconnect to the same person?</title><desc id="desc">The figure shows the ReID work I owned within the team tracking system. Both thresholds pass: Appearance similarity and supporting-match ratio both qualify Compare appearance across frames: Use FastReID for similarity and supporting-match ratios Reconnect the track: Link the match back to the tracking record At least one threshold fails: Similarity or the supporting-match ratio is too low Keep both checks: A high single-frame score still needs support Retain uncertainty: Avoid merging identities on weak evidence</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="1059" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">How can tracking reconnect</tspan><tspan x="28" dy="37.12">to the same person?</tspan></text>
<rect x="28" y="125.24" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Both thresholds pass</tspan></text><text x="43" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Appearance similarity and</tspan><tspan x="43" dy="25.6">supporting-match ratio both qualify</tspan></text><path d="M228 238.6V261.6" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="261.6" width="400" height="141.51999999999998" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="292.6" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Compare appearance across</tspan><tspan x="43" dy="28.16">frames</tspan></text><text x="43" y="348.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Use FastReID for similarity and</tspan><tspan x="43" dy="25.6">supporting-match ratios</tspan></text><path d="M228 403.12V426.12" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="426.12" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="457.12" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">Reconnect the track</tspan></text><text x="43" y="485.28000000000003" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Link the match back to the tracking</tspan><tspan x="43" dy="25.6">record</tspan></text><rect x="28" y="574.48" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="605.48" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">At least one threshold fails</tspan></text><text x="43" y="633.64" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Similarity or the supporting-match</tspan><tspan x="43" dy="25.6">ratio is too low</tspan></text><path d="M228 687.84V710.84" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="710.84" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="741.84" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Keep both checks</tspan></text><text x="43" y="770" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">A high single-frame score still needs</tspan><tspan x="43" dy="25.6">support</tspan></text><path d="M228 824.2V847.2" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="847.2" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="878.2" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">Retain uncertainty</tspan></text><text x="43" y="906.36" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Avoid merging identities on weak</tspan><tspan x="43" dy="25.6">evidence</tspan></text>
<path d="M28 985.5600000000001H428" stroke="#a7babb"/><text x="28" y="1010.5600000000001" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">The figure shows the ReID work I owned</tspan><tspan x="28" dy="25.6">within the team tracking system.</tspan></text>
