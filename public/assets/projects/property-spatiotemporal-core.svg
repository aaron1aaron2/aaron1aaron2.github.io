<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 439" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">如何預測區域交易價格與交易量？</title><desc id="desc">預測目標為區域指標。單筆估價需另行驗證。 月度交易: 由實價登錄彙整區域月度資訊 區域關係: 把空間及時間訊號納入比較 GMAN 實驗: 以第三方方法為基礎，建立模型並按區域評估 區域平均單位價: 比較不同分區的預測表現 交易量: 同時保留成交量的預測目標</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="439" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">如何預測區域交易價格與交易量？</tspan></text>
<text x="28" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">區域訊號</tspan></text><text x="261" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="261" dy="0">時空模型</tspan></text><text x="494" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="494" dy="0">預測目標</tspan></text><path d="M226 179.4H243.5V308.76H226" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M243.5 244.08000000000004H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 244.08000000000004H476.5V179.4H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M476.5 244.08000000000004V308.76H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="122.72000000000001" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">月度交易</tspan></text><text x="43" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">由實價登錄彙整區</tspan><tspan x="43" dy="25.6">域月度資訊</tspan></text><rect x="28" y="252.08" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="283.08000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">區域關係</tspan></text><text x="43" y="311.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">把空間及時間訊號</tspan><tspan x="43" dy="25.6">納入比較</tspan></text><rect x="261" y="174.60000000000002" width="198" height="138.96" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="276" y="205.60000000000002" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">GMAN 實驗</tspan></text><text x="276" y="233.76000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">以第三方方法為基</tspan><tspan x="276" dy="25.6">礎，建立模型並按</tspan><tspan x="276" dy="25.6">區域評估</tspan></text><rect x="494" y="122.72000000000001" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">區域平均單位價</tspan></text><text x="509" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">比較不同分區的預</tspan><tspan x="509" dy="25.6">測表現</tspan></text><rect x="494" y="252.08" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="283.08000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">交易量</tspan></text><text x="509" y="311.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">同時保留成交量的</tspan><tspan x="509" dy="25.6">預測目標</tspan></text>
<path d="M28 390.44H692" stroke="#a7babb"/><text x="28" y="415.44" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">預測目標為區域指標。單筆估價需另行驗證。</tspan></text>
</g></svg>
