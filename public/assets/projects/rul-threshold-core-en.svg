<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 687" role="img" aria-labelledby="title desc" lang="en">
<title id="title">When can a model recommendation change a threshold?</title><desc id="desc">Control-flow validation and field calibration of remaining-life accuracy are tracked separately. Eligible for auto-adoption: The recommendation meets policy and the sensor is unlocked Adopt and log: Preserve the suggestion, adopted value and history Apply with safety checks: Track adoption and device application separately Locked or out of policy: Keep the suggestion available for review Keep the current setting: Preserve operator control No automatic application: The device keeps its setting</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="687" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">When can a model recommendation change</tspan><tspan x="28" dy="40.96">a threshold?</tspan></text>
<text x="28" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">Condition</tspan></text><text x="261" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="261" dy="0">Platform decision</tspan></text><text x="494" y="148.92000000000002" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="494" dy="0">Device action</tspan></text><path d="M226 272.84000000000003H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 272.84000000000003H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="163.68" width="198" height="218.32" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="194.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Eligible for</tspan><tspan x="43" dy="28.16">auto-adoption</tspan></text><text x="43" y="251" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">The</tspan><tspan x="43" dy="25.6">recommendation</tspan><tspan x="43" dy="25.6">meets policy and</tspan><tspan x="43" dy="25.6">the sensor is</tspan><tspan x="43" dy="25.6">unlocked</tspan></text><rect x="261" y="163.68" width="198" height="218.32" rx="4" fill="white" stroke="#a7babb"/><text x="276" y="194.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="276" dy="0">Adopt and log</tspan></text><text x="276" y="222.84" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">Preserve the</tspan><tspan x="276" dy="25.6">suggestion,</tspan><tspan x="276" dy="25.6">adopted value</tspan><tspan x="276" dy="25.6">and history</tspan></text><rect x="494" y="163.68" width="198" height="218.32" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="509" y="194.68" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="509" dy="0">Apply with</tspan><tspan x="509" dy="28.16">safety checks</tspan></text><text x="509" y="251" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">Track adoption</tspan><tspan x="509" dy="25.6">and device</tspan><tspan x="509" dy="25.6">application</tspan><tspan x="509" dy="25.6">separately</tspan></text><path d="M226 492.36H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 492.36H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="396" width="198" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="427" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Locked or out</tspan><tspan x="43" dy="28.16">of policy</tspan></text><text x="43" y="483.32" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Keep the</tspan><tspan x="43" dy="25.6">suggestion</tspan><tspan x="43" dy="25.6">available for</tspan><tspan x="43" dy="25.6">review</tspan></text><rect x="261" y="396" width="198" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="276" y="427" fill="#18353d" font-size="22" font-weight="700"><tspan x="276" dy="0">Keep the</tspan><tspan x="276" dy="28.16">current setting</tspan></text><text x="276" y="483.32" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">Preserve</tspan><tspan x="276" dy="25.6">operator control</tspan></text><rect x="494" y="396" width="198" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="427" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">No automatic</tspan><tspan x="509" dy="28.16">application</tspan></text><text x="509" y="483.32" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">The device</tspan><tspan x="509" dy="25.6">keeps its setting</tspan></text>
<path d="M28 613.72H692" stroke="#a7babb"/><text x="28" y="638.72" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">Control-flow validation and field calibration of remaining-life</tspan><tspan x="28" dy="25.6">accuracy are tracked separately.</tspan></text>
</g></svg>
