<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 439" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">觀光需求怎麼影響路線與班次？</title><desc id="desc">需求是代理訊號推估。實際乘車量與營運成效仍待驗證。 需求訊號: 人流、搜尋熱度與熱門時段 景點距離: 以點間距離形成分組矩陣 分時需求與路線: 月人流分攤到星期與小時，探索 TSP 路線 空間方案: 以地圖檢視路線 時段規劃: 以班表及流向圖比較</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="439" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">觀光需求怎麼影響路線與班次？</tspan></text>
<text x="28" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">觀察訊號</tspan></text><text x="261" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="261" dy="0">路線探索</tspan></text><text x="494" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="494" dy="0">規劃介面</tspan></text><path d="M226 179.4H243.5V308.76H226" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M243.5 244.08000000000004H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 244.08000000000004H476.5V179.4H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M476.5 244.08000000000004V308.76H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="122.72000000000001" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">需求訊號</tspan></text><text x="43" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">人流、搜尋熱度與</tspan><tspan x="43" dy="25.6">熱門時段</tspan></text><rect x="28" y="252.08" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="283.08000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">景點距離</tspan></text><text x="43" y="311.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">以點間距離形成分</tspan><tspan x="43" dy="25.6">組矩陣</tspan></text><rect x="261" y="174.60000000000002" width="198" height="138.96" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="276" y="205.60000000000002" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">分時需求與路線</tspan></text><text x="276" y="233.76000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">月人流分攤到星期</tspan><tspan x="276" dy="25.6">與小時，探索</tspan><tspan x="276" dy="25.6">TSP 路線</tspan></text><rect x="494" y="122.72000000000001" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">空間方案</tspan></text><text x="509" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">以地圖檢視路線</tspan></text><rect x="494" y="252.08" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="283.08000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">時段規劃</tspan></text><text x="509" y="311.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">以班表及流向圖比</tspan><tspan x="509" dy="25.6">較</tspan></text>
