<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 533" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">怎麼把樣本地址轉成可估算的訪查路程？</title><desc id="desc">以實際訪查路程核對估算，才能確認誤差。 限定實際訪區: 依訪員負責區域分組 補齊點間距離: 建立距離矩陣，標記採估計規則的缺值 排序並估算: 分區求 TSP，產出拜訪順序、總距離與地圖</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="533" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">怎麼把樣本地址轉成可估算的</tspan><tspan x="28" dy="37.12">訪查路程？</tspan></text>
<rect x="28" y="125.24" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">限定實際訪區</tspan></text><text x="43" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">依訪員負責區域分組</tspan></text><path d="M228 213V236" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="236" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="267" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">補齊點間距離</tspan></text><text x="43" y="295.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">建立距離矩陣，標記採估計規則的缺值</tspan></text><path d="M228 323.76V346.76" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="346.76" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="377.76" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">排序並估算</tspan></text><text x="43" y="405.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">分區求 TSP，產出拜訪順序、總距離與地</tspan><tspan x="43" dy="25.6">圖</tspan></text>
<path d="M28 485.12H428" stroke="#a7babb"/><text x="28" y="510.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">以實際訪查路程核對估算，才能確認誤差。</tspan></text>
</g></svg>
