<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 559" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">把現場觀察轉成可檢驗的電流分析</title><desc id="desc">統計差異可檢驗觀察。根因需要獨立的現場證據。 重建比較口徑: 補資料缺口，對齊事件範圍與運轉條件 比較工況: 使用分鐘中位數、非參數檢定與效果量 保留待驗假說: 交付差異說明，請現場補驗轉速與流量等因素</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="559" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">把現場觀察轉成可檢驗的電流</tspan><tspan x="28" dy="37.12">分析</tspan></text>
<rect x="28" y="125.24" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">重建比較口徑</tspan></text><text x="43" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">補資料缺口，對齊事件範圍與運轉條件</tspan></text><path d="M228 213V236" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="236" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="267" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">比較工況</tspan></text><text x="43" y="295.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">使用分鐘中位數、非參數檢定與效果量</tspan></text><path d="M228 323.76V346.76" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="346.76" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="377.76" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">保留待驗假說</tspan></text><text x="43" y="405.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">交付差異說明，請現場補驗轉速與流量等</tspan><tspan x="43" dy="25.6">因素</tspan></text>
<path d="M28 485.12H428" stroke="#a7babb"/><text x="28" y="510.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">統計差異可檢驗觀察。根因需要獨立的現場證</tspan><tspan x="28" dy="25.6">據。</tspan></text>
</g></svg>
