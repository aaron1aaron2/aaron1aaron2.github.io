<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 521" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How does parallel development preserve reviewable evidence?</title><desc id="desc">Changes stay traceable. People retain merge and release decisions. Requirements and tests → issue record: Record the issue, conditions, ownership and acceptance criteria Issue record → isolated branch: Develop and verify in parallel, logging changes and tests Verification evidence → human review: Review the PR, tests and limits before approval or revision</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="521" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">How does parallel development preserve</tspan><tspan x="28" dy="40.96">reviewable evidence?</tspan></text>
<rect x="76" y="132.92000000000002" width="616" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="163.92000000000002" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">Requirements and tests → issue record</tspan></text><text x="91" y="192.08" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Record the issue, conditions, ownership and acceptance</tspan><tspan x="91" dy="25.6">criteria</tspan></text><circle cx="43" cy="156.92000000000002" r="14" fill="#0d5e55"/><text x="38" y="162.92000000000002" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">1</tspan></text><path d="M43 172.92000000000002V267.28000000000003" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="259.28000000000003" width="616" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="290.28000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">Issue record → isolated branch</tspan></text><text x="91" y="318.44000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Develop and verify in parallel, logging changes and tests</tspan></text><circle cx="43" cy="283.28000000000003" r="14" fill="#0d5e55"/><text x="38" y="289.28000000000003" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">2</tspan></text><path d="M43 299.28000000000003V368.04" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="360.04" width="616" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="91" y="391.04" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="91" dy="0">Verification evidence → human review</tspan></text><text x="91" y="419.20000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Review the PR, tests and limits before approval or revision</tspan></text><circle cx="43" cy="384.04" r="14" fill="#0d5e55"/><text x="38" y="390.04" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">3</tspan></text>
<path d="M28 472.8H692" stroke="#a7babb"/><text x="28" y="497.8" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">Changes stay traceable. People retain merge and release decisions.</tspan></text>
