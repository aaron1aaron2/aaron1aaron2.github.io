<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">How far can a delegate help, and who</tspan><tspan x="28" dy="40.96">confirms the request?</tspan></text>
<rect x="76" y="132.92000000000002" width="616" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="163.92000000000002" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">Applicant → delegate</tspan></text><text x="91" y="192.08" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Authorize a specific application or booking scope</tspan></text><circle cx="43" cy="156.92000000000002" r="14" fill="#0d5e55"/><text x="38" y="162.92000000000002" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">1</tspan></text><path d="M43 172.92000000000002V241.68" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="233.68" width="616" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="264.68" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">Delegate → applicant</tspan></text><text x="91" y="292.84000000000003" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Prepare the material and return it for approval</tspan></text><circle cx="43" cy="257.68" r="14" fill="#0d5e55"/><text x="38" y="263.68" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">2</tspan></text><path d="M43 273.68V342.44" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="334.44" width="616" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="91" y="365.44" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="91" dy="0">Delegate → simulated service</tspan></text><text x="91" y="393.6" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">Only the applicant-approved content can be submitted in</tspan><tspan x="91" dy="25.6">the simulation</tspan></text><circle cx="43" cy="358.44" r="14" fill="#0d5e55"/><text x="38" y="364.44" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">3</tspan></text>
<path d="M28 472.8H692" stroke="#a7babb"/><text x="28" y="497.8" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">The finalist demo was a simulation. Identity verification and</tspan><tspan x="28" dy="25.6">government integration remain untested.</tspan></text>
