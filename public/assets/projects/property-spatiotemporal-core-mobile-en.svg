<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">How can we forecast</tspan><tspan x="28" dy="37.12">regional prices and</tspan><tspan x="28" dy="37.12">transaction counts?</tspan></text>
<text x="28" y="176.36" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">Regional inputs</tspan></text><rect x="28" y="190.36" width="194" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="221.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Monthly</tspan><tspan x="43" dy="28.16">transactions</tspan></text><text x="43" y="277.68" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Aggregate</tspan><tspan x="43" dy="25.6">registered sales</tspan><tspan x="43" dy="25.6">by region and</tspan><tspan x="43" dy="25.6">month</tspan></text><rect x="234" y="190.36" width="194" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="221.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">Regional</tspan><tspan x="249" dy="28.16">relationships</tspan></text><text x="249" y="277.68" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">Include spatial</tspan><tspan x="249" dy="25.6">and temporal</tspan><tspan x="249" dy="25.6">signals</tspan></text><path d="M125 383.08000000000004V397.08000000000004H331V383.08000000000004" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 397.08000000000004V417.08000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="417.08000000000004" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="448.08000000000004" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">GMAN-based experiments</tspan></text><text x="43" y="476.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Build on third-party GMAN and</tspan><tspan x="43" dy="25.6">evaluate by region</tspan></text><path d="M228 530.44V544.44H125V564.44" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 544.44H331V564.44" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="564.44" width="194" height="167.12" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="595.44" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Regional mean</tspan><tspan x="43" dy="28.16">unit price</tspan></text><text x="43" y="651.7600000000001" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Compare</tspan><tspan x="43" dy="25.6">performance by</tspan><tspan x="43" dy="25.6">region</tspan></text><rect x="234" y="564.44" width="194" height="167.12" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="595.44" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">Transaction</tspan><tspan x="249" dy="28.16">count</tspan></text><text x="249" y="651.7600000000001" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">Keep volume as</tspan><tspan x="249" dy="25.6">a separate</tspan><tspan x="249" dy="25.6">prediction target</tspan></text>
<path d="M28 756.5600000000001H428" stroke="#a7babb"/><text x="28" y="781.5600000000001" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">Targets are regional indicators.</tspan><tspan x="28" dy="25.6">Individual valuations need separate</tspan><tspan x="28" dy="25.6">validation.</tspan></text>
