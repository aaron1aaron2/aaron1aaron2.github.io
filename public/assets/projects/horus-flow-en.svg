<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 810" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Aaron&#39;s ReID branch within the team system</title><desc id="desc">Aaron owned ReID; FastReID is third-party. Tracking, face recognition and the complete system were team work, with identity and latency limits. Solid arrows show process or data flow; dashed arrows show review, conditions or feedback.</desc>
