<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 651" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">多機型如何逐件檢測</title><desc id="desc">第二階段軟體功能已驗收。第三階段以現場樣本驗證 OK／NG 判定。 量測計畫: 依機型定義階段與測點 基準庫: 錄製、確認並管理基準版本及門檻 工單與待測物: 工單採用計畫版本，待測物按測點量測並對照基準 OK／NG／無法判定: 缺少必要測點時轉人工複查 偏離定位: 回查偏離的階段、測點與特徵</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="651" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">多機型如何逐件檢測</tspan></text>
<text x="28" y="102.12" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">定義比較方法</tspan></text><rect x="28" y="116.12" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="147.12" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">量測計畫</tspan></text><text x="43" y="175.28" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">依機型定義階段與</tspan><tspan x="43" dy="25.6">測點</tspan></text><rect x="234" y="116.12" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="147.12" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">基準庫</tspan></text><text x="249" y="175.28" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">錄製、確認並管理</tspan><tspan x="249" dy="25.6">基準版本及門檻</tspan></text><path d="M125 229.48000000000002V243.48000000000002H331V229.48000000000002" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 243.48000000000002V263.48" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="263.48" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="294.48" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">工單與待測物</tspan></text><text x="43" y="322.64000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">工單採用計畫版本，待測物按測點量測並</tspan><tspan x="43" dy="25.6">對照基準</tspan></text><path d="M228 376.84000000000003V390.84000000000003H125V410.84000000000003" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 390.84000000000003H331V410.84000000000003" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="410.84000000000003" width="194" height="141.51999999999998" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="441.84000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">OK／NG／無法</tspan><tspan x="43" dy="28.16">判定</tspan></text><text x="43" y="498.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">缺少必要測點時轉</tspan><tspan x="43" dy="25.6">人工複查</tspan></text><rect x="234" y="410.84000000000003" width="194" height="141.51999999999998" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="441.84000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">偏離定位</tspan></text><text x="249" y="470.00000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">回查偏離的階段、</tspan><tspan x="249" dy="25.6">測點與特徵</tspan></text>
<path d="M28 577.36H428" stroke="#a7babb"/><text x="28" y="602.36" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">第二階段軟體功能已驗收。第三階段以現場樣</tspan><tspan x="28" dy="25.6">本驗證 OK／NG 判定。</tspan></text>
