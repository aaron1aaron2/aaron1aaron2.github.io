<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 559" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">擷取中斷後，如何補回時序缺口？</title><desc id="desc">補入值為模型預測。個人負責叢集、協作與示範。 找出缺口: 從已儲存的時序定位缺值 分散式補值: 團隊補值模型在本人建置的 Spark 環境執行 交付展示: 以團隊儀表板呈現恢復流程</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="559" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">擷取中斷後，如何補回時序缺</tspan><tspan x="28" dy="37.12">口？</tspan></text>
<rect x="28" y="125.24" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">找出缺口</tspan></text><text x="43" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">從已儲存的時序定位缺值</tspan></text><path d="M228 213V236" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="236" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="267" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">分散式補值</tspan></text><text x="43" y="295.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">團隊補值模型在本人建置的 Spark 環境執</tspan><tspan x="43" dy="25.6">行</tspan></text><path d="M228 349.36V372.36" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="372.36" width="400" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="403.36" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">交付展示</tspan></text><text x="43" y="431.52000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">以團隊儀表板呈現恢復流程</tspan></text>
<path d="M28 485.12H428" stroke="#a7babb"/><text x="28" y="510.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">補入值為模型預測。個人負責叢集、協作與示</tspan><tspan x="28" dy="25.6">範。</tspan></text>
</g></svg>
