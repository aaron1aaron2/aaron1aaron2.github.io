<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">把現場觀察轉成可檢驗的電流分析</title><desc id="desc">統計差異可檢驗觀察。根因需要獨立的現場證據。 重建比較口徑: 補資料缺口，對齊事件範圍與運轉條件 比較工況: 使用分鐘中位數、非參數檢定與效果量 保留待驗假說: 交付差異說明，請現場補驗轉速與流量等因素</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="304" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">把現場觀察轉成可檢驗的電流分析</tspan></text>
<path d="M226 161.44H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 161.44H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="91.96000000000001" width="198" height="138.96" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">重建比較口徑</tspan></text><text x="43" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">補資料缺口，對齊</tspan><tspan x="43" dy="25.6">事件範圍與運轉條</tspan><tspan x="43" dy="25.6">件</tspan></text><rect x="261" y="91.96000000000001" width="198" height="138.96" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="276" y="122.96000000000001" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">比較工況</tspan></text><text x="276" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">使用分鐘中位數、</tspan><tspan x="276" dy="25.6">非參數檢定與效果</tspan><tspan x="276" dy="25.6">量</tspan></text><rect x="494" y="91.96000000000001" width="198" height="138.96" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">保留待驗假說</tspan></text><text x="509" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">交付差異說明，請</tspan><tspan x="509" dy="25.6">現場補驗轉速與流</tspan><tspan x="509" dy="25.6">量等因素</tspan></text>
<path d="M28 255.92000000000002H692" stroke="#a7babb"/><text x="28" y="280.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">統計差異可檢驗觀察。根因需要獨立的現場證據。</tspan></text>
</g></svg>
