00000005H331V527.32" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="527.32" width="194" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="558.32" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Pass, fail or</tspan><tspan x="43" dy="28.16">inconclusive</tspan></text><text x="43" y="614.6400000000001" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Missing</tspan><tspan x="43" dy="25.6">required points</tspan><tspan x="43" dy="25.6">go to manual</tspan><tspan x="43" dy="25.6">review</tspan></text><rect x="234" y="527.32" width="194" height="192.72" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="558.32" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">Locate</tspan><tspan x="249" dy="28.16">deviations</tspan></text><text x="249" y="614.6400000000001" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">Trace</tspan><tspan x="249" dy="25.6">deviations to</tspan><tspan x="249" dy="25.6">stages, points</tspan><tspan x="249" dy="25.6">and features</tspan></text>
