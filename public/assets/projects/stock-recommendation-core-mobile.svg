<text x="28" y="139.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">候選訊號</tspan></text><rect x="28" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">財務特徵</tspan></text><text x="43" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">以公司資料描述股</tspan><tspan x="43" dy="25.6">票</tspan></text><rect x="234" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">使用者行為</tspan></text><text x="249" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">探索瀏覽、訂閱及</tspan><tspan x="249" dy="25.6">股票共現</tspan></text><path d="M125 266.6V280.6H331V266.6" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 280.6V300.6" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="300.6" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="331.6" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">整合團隊模組</tspan></text><text x="43" y="359.76000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">將各推薦來源串到本人開發的 Telegram</tspan><tspan x="43" dy="25.6">Bot</tspan></text><path d="M228 413.96000000000004V427.96000000000004H125V447.96000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 427.96000000000004H331V447.96000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="447.96000000000004" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="478.96000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">互動查詢</tspan></text><text x="43" y="507.12000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">讓使用者在聊天中</tspan><tspan x="43" dy="25.6">取得資訊</tspan></text><rect x="234" y="447.96000000000004" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="478.96000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">訂閱推播</tspan></text><text x="249" y="507.12000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">依原型設計提供自</tspan><tspan x="249" dy="25.6">動推送</tspan></text>
<path d="M28 586.32H428" stroke="#a7babb"/><text x="28" y="611.32" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">功能為原型成果。線上採用與交易成效未量測</tspan><tspan x="28" dy="25.6">。</tspan></text>
