<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1116" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Platform layers: intake, coordination, analysis and feedback</title><desc id="desc">Logical layers, not deployment topology. Internal job queues differ from MQTT; broker choice is configurable and internal service delegation is not implied by these lines. Solid arrows show process or data flow; dashed arrows show review, conditions or feedback.</desc>
