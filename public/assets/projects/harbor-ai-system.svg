<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1116" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">平台分層：資料入口、協調、分析與回饋</title><desc id="desc">邏輯分層，不是部署拓樸。內部工作佇列與 MQTT 不同；broker 依配置，各服務的內部委派不由圖中連線推定。 實線表示資料或處理流程；虛線表示審查、條件或回饋。</desc>
