<title id="title">From tourism signals to route exploration</title><desc id="desc">Independent project. Tourism counts and popularity are demand proxies; actual ridership and operating outcomes were not validated. Solid arrows show process or data flow; dashed arrows show review, conditions or feedback.</desc>
