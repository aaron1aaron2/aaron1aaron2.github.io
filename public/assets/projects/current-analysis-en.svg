<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 686" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Review observations and data consistency separately</title><desc id="desc">Root-cause attribution still needs field conditions such as speed and flow; association alone is not diagnosis. Solid arrows show process or data flow; dashed arrows show review, conditions or feedback.</desc>
