<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 825" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Event flow: alarms, data readiness, analysis and handling</title><desc id="desc">Analysis completion does not establish complete data; no data/failure does not mean no anomaly. RUL and recurring reports have separate schedules; reports do not require prior human handling. Solid arrows show process or data flow; dashed arrows show review, conditions or feedback.</desc>
<defs><marker id="harbor-ai-flow-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#526773"/></marker></defs>
<rect width="1040" height="825" fill="#fff"/>
<g font-family="Arial,Microsoft JhengHei,sans-serif">
<text x="40" y="48" fill="#172e3b" font-size="29" font-weight="600"><tspan x="40" dy="0">Event flow: alarms, data readiness, analysis and handling</tspan></text>
<text x="40" y="82" fill="#61717a" font-size="17"><tspan x="40" dy="0">Solid: data / process  ·  Dashed: review / feedback</tspan></text>
<path d="M40 103H1000" stroke="#ccd5da"/>
<path d="M260 242H285" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#harbor-ai-flow-en)"/>
<path d="M505 242H530" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#harbor-ai-flow-en)"/>
<path d="M750 242H775" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#harbor-ai-flow-en)"/>
