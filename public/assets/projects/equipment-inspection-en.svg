<rect x="40" y="155" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="55" y="197.6" fill="#172e3b" font-size="22" font-weight="600"><tspan x="55" dy="0">Inspection plan</tspan></text>
<text x="55" y="229.76" fill="#52636d" font-size="19"><tspan x="55" dy="0">Test items, points and</tspan><tspan x="55" dy="24.32">reference baseline</tspan></text>
<rect x="395" y="155" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="410" y="198.52" fill="#172e3b" font-size="21" font-weight="600"><tspan x="410" dy="0">Work order and batch</tspan></text>
<text x="410" y="229.4" fill="#52636d" font-size="18"><tspan x="410" dy="0">Track fixture and test</tspan><tspan x="410" dy="23.04">item separately</tspan></text>
<rect x="750" y="155" width="250" height="125" rx="3" fill="#fff" stroke="#8c6b37" stroke-width="2"/>
<text x="765" y="187.42" fill="#71572b" font-size="19.5" font-weight="600"><tspan x="765" dy="0">Sensor installation</tspan><tspan x="765" dy="24.96">check</tspan></text>
<text x="765" y="241.34" fill="#52636d" font-size="16.5"><tspan x="765" dy="0">Sensor ID, position and</tspan><tspan x="765" dy="21.12">detachment alerts</tspan></text>
<rect x="750" y="380" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
<text x="765" y="412.78" fill="#172e3b" font-size="20.5" font-weight="600"><tspan x="765" dy="0">Measurement</tspan></text>
<text x="765" y="443.02" fill="#52636d" font-size="17.5"><tspan x="765" dy="0">Start after</tspan><tspan x="765" dy="22.400000000000002">installation</tspan><tspan x="765" dy="22.400000000000002">confirmation</tspan></text>
