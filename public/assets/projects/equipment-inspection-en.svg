<text x="410" y="466.34" fill="#52636d" font-size="16.5"><tspan x="410" dy="0">Baseline, thresholds and</tspan><tspan x="410" dy="21.12">review</tspan></text>
<rect x="40" y="380" width="250" height="125" rx="3" fill="#fff" stroke="#617d8c" stroke-width="1.5"/>
