<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc" lang="en">
<title id="title">End-of-line inspection workflow</title><desc id="desc">Plan, work order and dashboard are the three core interface types; threshold calibration and acceptance remain separate. Solid arrows show process or data flow; dashed arrows show review, conditions or feedback.</desc>
<defs><marker id="equipment-inspection-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#526773"/></marker></defs>
