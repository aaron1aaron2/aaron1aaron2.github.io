<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" width="1000" height="592" role="img" aria-labelledby="title desc" xml:lang="zh-Hant">
<title id="title">診斷報告查閱與交付</title><desc id="desc">報表清單把背景產報狀態和對應操作放在同一列，方便使用者確認可查閱的結果。</desc>
<style>text{font-family:system-ui,"Microsoft JhengHei",sans-serif;fill:#20312e;font-size:20px}.title{font-weight:750;font-size:34px}.heading{font-weight:700;font-size:21px}.small,.pill{font-size:17px}.pill{font-weight:700}.muted{fill:#47605a;font-size:18px}</style>
<rect x="1" y="1" width="998" height="590" rx="18" fill="#f4f7f5" stroke="#cad5d0"/><text x="28" y="43" class="muted">設計示意｜虛構資料</text><text x="28" y="87" class="title">診斷報告查閱與交付</text><rect x="28" y="120" width="944" height="397" rx="10" fill="#fff" stroke="#ccd6d2"/><text x="46" y="153" class="heading">報告清單</text><rect x="46" y="179" width="907" height="51" rx="6" fill="#eaf2ef" stroke="none"/><text x="63" y="211" class="heading">報告／觸發方式</text><text x="471" y="211" class="heading">產報狀態</text><text x="732" y="211" class="heading">可用操作</text><text x="63" y="276" class="label">設備診斷｜單次</text><rect x="470" y="250" width="214" height="36" rx="18" fill="#e0eeea" stroke="none"/><text x="483" y="274" class="pill">已完成</text><text x="732" y="276" class="heading">查看／下載</text><rect x="63" y="307" width="869" height="1" rx="0" fill="#dbe3e0" stroke="none"/><text x="63" y="355" class="label">設備趨勢｜排程</text><rect x="470" y="329" width="214" height="36" rx="18" fill="#e0eeea" stroke="none"/><text x="483" y="353" class="pill">處理中</text><text x="732" y="355" class="heading">查看進度</text><rect x="63" y="386" width="869" height="1" rx="0" fill="#dbe3e0" stroke="none"/><text x="63" y="434" class="label">事件分析｜單次</text><rect x="470" y="408" width="214" height="36" rx="18" fill="#f9ebcb" stroke="none"/><text x="483" y="432" class="pill">資料不足</text><text x="732" y="434" class="heading">查看原因</text><rect x="63" y="465" width="869" height="1" rx="0" fill="#dbe3e0" stroke="none"/>
</svg>
