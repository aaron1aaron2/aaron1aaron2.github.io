<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 634" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">如何從 DNA 序列預測染色質交互作用？</title><desc id="desc">部分資料前處理沿用 ChINN。圖示為研究方法摘要。 局部訊號: 用多尺度卷積擷取短範圍特徵 較寬的序列脈絡: 對序列對比較不同尺度的表示 合併兩段序列表示: 根據成對特徵估計染色質交互作用 消融與跨資料集: 檢驗尺度設計與資料依賴 模型解釋: 回查模型對哪些序列區段敏感</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="634" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">如何從 DNA 序列預測染色質</tspan><tspan x="28" dy="37.12">交互作用？</tspan></text>
<text x="28" y="139.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">序列訊號</tspan></text><rect x="28" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">局部訊號</tspan></text><text x="43" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">用多尺度卷積擷取</tspan><tspan x="43" dy="25.6">短範圍特徵</tspan></text><rect x="234" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">較寬的序列脈絡</tspan></text><text x="249" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">對序列對比較不同</tspan><tspan x="249" dy="25.6">尺度的表示</tspan></text><path d="M125 266.6V280.6H331V266.6" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 280.6V300.6" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="300.6" width="400" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="331.6" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">合併兩段序列表示</tspan></text><text x="43" y="359.76000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">根據成對特徵估計染色質交互作用</tspan></text><path d="M228 388.36V402.36H125V422.36" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 402.36H331V422.36" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="422.36" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="453.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">消融與跨資料集</tspan></text><text x="43" y="481.52000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">檢驗尺度設計與資</tspan><tspan x="43" dy="25.6">料依賴</tspan></text><rect x="234" y="422.36" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="453.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">模型解釋</tspan></text><text x="249" y="481.52000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">回查模型對哪些序</tspan><tspan x="249" dy="25.6">列區段敏感</tspan></text>
<path d="M28 560.72H428" stroke="#a7babb"/><text x="28" y="585.72" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">部分資料前處理沿用 ChINN。圖示為研究方</tspan><tspan x="28" dy="25.6">法摘要。</tspan></text>
</g></svg>
