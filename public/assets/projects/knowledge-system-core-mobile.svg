<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 484" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">同一個版本，不同角色要查到什麼？</title><desc id="desc">文件入口已建立，內容與版本一致性持續檢查。 產品／主管：確認狀態: 由需求與版本回查決策及驗證狀態。 開發：核對設計: 從設計規格追到程式變更及測試。 現場：安裝與操作: 依版本查找安裝文件與相應操作手冊。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="484" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">同一個版本，不同角色要查到</tspan><tspan x="28" dy="37.12">什麼？</tspan></text>
<text x="40" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="40" dy="0">讀者與任務</tspan></text><text x="197" y="141.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="197" dy="0">可回查的資料</tspan></text><path d="M28 156H428" stroke="#a7babb"/><path d="M179 156V232.32" stroke="#a7babb"/><text x="40" y="185" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">產品／主管：</tspan><tspan x="40" dy="28.16">確認狀態</tspan></text><text x="197" y="185" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">由需求與版本回查決策</tspan><tspan x="197" dy="26.88">及驗證狀態。</tspan></text><path d="M28 232.32H428" stroke="#a7babb"/><path d="M179 232.32V308.64" stroke="#a7babb"/><text x="40" y="261.32" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">開發：核對設</tspan><tspan x="40" dy="28.16">計</tspan></text><text x="197" y="261.32" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">從設計規格追到程式變</tspan><tspan x="197" dy="26.88">更及測試。</tspan></text><path d="M28 308.64H428" stroke="#a7babb"/><path d="M179 308.64V384.96" stroke="#a7babb"/><text x="40" y="337.64" fill="#18353d" font-size="22" font-weight="700"><tspan x="40" dy="0">現場：安裝與</tspan><tspan x="40" dy="28.16">操作</tspan></text><text x="197" y="337.64" fill="#455d66" font-size="21" font-weight="500"><tspan x="197" dy="0">依版本查找安裝文件與</tspan><tspan x="197" dy="26.88">相應操作手冊。</tspan></text><path d="M28 384.96H428" stroke="#a7babb"/>
<path d="M28 409.96H428" stroke="#a7babb"/><text x="28" y="434.96" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">文件入口已建立，內容與版本一致性持續檢查</tspan><tspan x="28" dy="25.6">。</tspan></text>
</g></svg>
