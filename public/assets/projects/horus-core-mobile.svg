<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 877" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">追蹤中斷後，怎麼接回同一個人？</title><desc id="desc">核心是本人負責的 ReID。整體追蹤系統由團隊整合。 兩項門檻皆通過: 多幀外觀相似度與支持比例均足夠 多幀外觀比較: FastReID 比較相似度與支持比例 接回追蹤: 將比對結果接回追蹤紀錄 任一門檻不足: 相似度或支持比例不足 維持門檻: 個別高分影格仍須其他影格支持 保留不確定性: 避免以弱證據合併身分</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="877" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">追蹤中斷後，怎麼接回同一個</tspan><tspan x="28" dy="37.12">人？</tspan></text>
<rect x="28" y="125.24" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">兩項門檻皆通過</tspan></text><text x="43" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">多幀外觀相似度與支持比例均足夠</tspan></text><path d="M228 213V236" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="236" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="267" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">多幀外觀比較</tspan></text><text x="43" y="295.16" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">FastReID 比較相似度與支持比例</tspan></text><path d="M228 323.76V346.76" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="346.76" width="400" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="377.76" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">接回追蹤</tspan></text><text x="43" y="405.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">將比對結果接回追蹤紀錄</tspan></text><rect x="28" y="469.52" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="500.52" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">任一門檻不足</tspan></text><text x="43" y="528.68" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">相似度或支持比例不足</tspan></text><path d="M228 557.28V580.28" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="580.28" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="611.28" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">維持門檻</tspan></text><text x="43" y="639.4399999999999" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">個別高分影格仍須其他影格支持</tspan></text><path d="M228 668.04V691.04" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="691.04" width="400" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="722.04" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">保留不確定性</tspan></text><text x="43" y="750.1999999999999" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">避免以弱證據合併身分</tspan></text>
<path d="M28 803.8H428" stroke="#a7babb"/><text x="28" y="828.8" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">核心是本人負責的 ReID。整體追蹤系統由團</tspan><tspan x="28" dy="25.6">隊整合。</tspan></text>
</g></svg>
