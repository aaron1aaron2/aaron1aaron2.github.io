<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">擷取中斷後，如何補回時序缺口？</title><desc id="desc">補入值為模型預測。個人負責叢集、協作與示範。 找出缺口: 從已儲存的時序定位缺值 分散式補值: 團隊補值模型在本人建置的 Spark 環境執行 交付展示: 以團隊儀表板呈現恢復流程</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="304" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">擷取中斷後，如何補回時序缺口？</tspan></text>
<path d="M226 161.44H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 161.44H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="91.96000000000001" width="198" height="138.96" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">找出缺口</tspan></text><text x="43" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">從已儲存的時序定</tspan><tspan x="43" dy="25.6">位缺值</tspan></text><rect x="261" y="91.96000000000001" width="198" height="138.96" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="276" y="122.96000000000001" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="276" dy="0">分散式補值</tspan></text><text x="276" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">團隊補值模型在本</tspan><tspan x="276" dy="25.6">人建置的 Spark</tspan><tspan x="276" dy="25.6">環境執行</tspan></text><rect x="494" y="91.96000000000001" width="198" height="138.96" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">交付展示</tspan></text><text x="509" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">以團隊儀表板呈現</tspan><tspan x="509" dy="25.6">恢復流程</tspan></text>
<path d="M28 255.92000000000002H692" stroke="#a7babb"/><text x="28" y="280.92" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">補入值為模型預測。個人負責叢集、協作與示範。</tspan></text>
</g></svg>
