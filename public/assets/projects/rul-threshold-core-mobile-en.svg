<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 1043" role="img" aria-labelledby="title desc" lang="en">
<title id="title">When can a model recommendation change a threshold?</title><desc id="desc">Control-flow validation and field calibration of remaining-life accuracy are tracked separately. Eligible for auto-adoption: The recommendation meets policy and the sensor is unlocked Adopt and log: Preserve the suggestion, adopted value and history Apply with safety checks: Track adoption and device application separately Locked or out of policy: Keep the suggestion available for review Keep the current setting: Preserve operator control No automatic application: The device keeps its setting</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="1043" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">When can a model</tspan><tspan x="28" dy="37.12">recommendation change a</tspan><tspan x="28" dy="37.12">threshold?</tspan></text>
<rect x="28" y="162.36" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="193.36" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Eligible for auto-adoption</tspan></text><text x="43" y="221.52" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">The recommendation meets policy and</tspan><tspan x="43" dy="25.6">the sensor is unlocked</tspan></text><path d="M228 275.72V298.72" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="298.72" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="329.72" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Adopt and log</tspan></text><text x="43" y="357.88000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Preserve the suggestion, adopted</tspan><tspan x="43" dy="25.6">value and history</tspan></text><path d="M228 412.08000000000004V435.08000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="435.08000000000004" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="466.08000000000004" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">Apply with safety checks</tspan></text><text x="43" y="494.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Track adoption and device</tspan><tspan x="43" dy="25.6">application separately</tspan></text><rect x="28" y="583.44" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="614.44" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Locked or out of policy</tspan></text><text x="43" y="642.6" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Keep the suggestion available for</tspan><tspan x="43" dy="25.6">review</tspan></text><path d="M228 696.8000000000001V719.8000000000001" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="719.8000000000001" width="400" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="750.8000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Keep the current setting</tspan></text><text x="43" y="778.96" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Preserve operator control</tspan></text><path d="M228 807.5600000000001V830.5600000000001" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="830.5600000000001" width="400" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="861.5600000000001" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">No automatic application</tspan></text><text x="43" y="889.72" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">The device keeps its setting</tspan></text>
<path d="M28 943.32H428" stroke="#a7babb"/><text x="28" y="968.32" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">Control-flow validation and field</tspan><tspan x="28" dy="25.6">calibration of remaining-life accuracy</tspan><tspan x="28" dy="25.6">are tracked separately.</tspan></text>
</g></svg>
