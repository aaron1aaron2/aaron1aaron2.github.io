<title id="title">Turn field observations into testable current analysis</title><desc id="desc">The analysis tests the reported differences. Identifying the cause requires independent field evidence. Rebuild the comparison: Close data gaps and align event scope and operating conditions Compare like conditions: Use minute medians, nonparametric tests and effect size Document open hypotheses: Explain differences and request field checks on speed and flow</desc>
