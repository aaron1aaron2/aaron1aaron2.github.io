<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 439" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">把推薦訊號接到使用者能操作的入口</title><desc id="desc">功能為原型成果。線上採用與交易成效未量測。 財務特徵: 以公司資料描述股票 使用者行為: 探索瀏覽、訂閱及股票共現 整合團隊模組: 將各推薦來源串到本人開發的 Telegram Bot 互動查詢: 讓使用者在聊天中取得資訊 訂閱推播: 依原型設計提供自動推送</desc>
