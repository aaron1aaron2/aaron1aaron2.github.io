<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">訪區分組、距離建模與路線輸出</title><desc id="desc">不展示真實地址；估計係數未證明已校準到實際道路距離。 實線表示資料或處理流程；虛線表示審查、條件或回饋。</desc>
