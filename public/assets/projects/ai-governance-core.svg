<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">並行開發如何保留可審查的證據？</title><desc id="desc">檢查重點是變更可追溯，合併和發布由人決定。 需求／回歸 → 問題紀錄: 保存問題、條件、責任及驗證基準 問題紀錄 → 隔離分支: 並行實作與驗證，把差異和測試寫入交付紀錄 驗證證據 → 人工審查: 查看 PR、測試與限制，再決定合併或退回</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="454" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">並行開發如何保留可審查的證據？</tspan></text>
<rect x="76" y="91.96000000000001" width="616" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">需求／回歸 → 問題紀錄</tspan></text><text x="91" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">保存問題、條件、責任及驗證基準</tspan></text><circle cx="43" cy="115.96000000000001" r="14" fill="#0d5e55"/><text x="38" y="121.96000000000001" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">1</tspan></text><path d="M43 131.96V200.72" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="192.72" width="616" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="223.72" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">問題紀錄 → 隔離分支</tspan></text><text x="91" y="251.88" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">並行實作與驗證，把差異和測試寫入交付紀錄</tspan></text><circle cx="43" cy="216.72" r="14" fill="#0d5e55"/><text x="38" y="222.72" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">2</tspan></text><path d="M43 232.72V301.48" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="293.48" width="616" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="91" y="324.48" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="91" dy="0">驗證證據 → 人工審查</tspan></text><text x="91" y="352.64000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">查看 PR、測試與限制，再決定合併或退回</tspan></text><circle cx="43" cy="317.48" r="14" fill="#0d5e55"/><text x="38" y="323.48" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">3</tspan></text>
<path d="M28 406.24H692" stroke="#a7babb"/><text x="28" y="431.24" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">檢查重點是變更可追溯，合併和發布由人決定。</tspan></text>
</g></svg>
