<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 437" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">追蹤中斷後，怎麼接回同一個人？</title><desc id="desc">核心是本人負責的 ReID。整體追蹤系統由團隊整合。 兩項門檻皆通過: 多幀外觀相似度與支持比例均足夠 多幀外觀比較: FastReID 比較相似度與支持比例 接回追蹤: 將比對結果接回追蹤紀錄 任一門檻不足: 相似度或支持比例不足 維持門檻: 個別高分影格仍須其他影格支持 保留不確定性: 避免以弱證據合併身分</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="437" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">追蹤中斷後，怎麼接回同一個人？</tspan></text>
<text x="28" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">追蹤狀況</tspan></text><text x="261" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="261" dy="0">可用依據</tspan></text><text x="494" y="107.96000000000001" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="494" dy="0">處置</tspan></text><path d="M226 179.4H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 179.4H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="122.72000000000001" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">兩項門檻皆通過</tspan></text><text x="43" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">多幀外觀相似度與</tspan><tspan x="43" dy="25.6">支持比例均足夠</tspan></text><rect x="261" y="122.72000000000001" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="276" y="153.72000000000003" fill="#18353d" font-size="22" font-weight="700"><tspan x="276" dy="0">多幀外觀比較</tspan></text><text x="276" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">FastReID 比較相</tspan><tspan x="276" dy="25.6">似度與支持比例</tspan></text><rect x="494" y="122.72000000000001" width="198" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="509" y="153.72000000000003" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="509" dy="0">接回追蹤</tspan></text><text x="509" y="181.88000000000002" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">將比對結果接回追</tspan><tspan x="509" dy="25.6">蹤紀錄</tspan></text><path d="M226 306.76H261" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M459 306.76H494" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="250.08" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="281.08000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">任一門檻不足</tspan></text><text x="43" y="309.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">相似度或支持比例</tspan><tspan x="43" dy="25.6">不足</tspan></text><rect x="261" y="250.08" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="276" y="281.08000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="276" dy="0">維持門檻</tspan></text><text x="276" y="309.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="276" dy="0">個別高分影格仍須</tspan><tspan x="276" dy="25.6">其他影格支持</tspan></text><rect x="494" y="250.08" width="198" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="509" y="281.08000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="509" dy="0">保留不確定性</tspan></text><text x="509" y="309.24000000000007" fill="#455d66" font-size="20" font-weight="500"><tspan x="509" dy="0">避免以弱證據合併</tspan><tspan x="509" dy="25.6">身分</tspan></text>
