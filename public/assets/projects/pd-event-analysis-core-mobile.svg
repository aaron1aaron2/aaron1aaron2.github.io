<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 539" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">告警到了，哪些波形已能分析？</title><desc id="desc">成功執行與部分資料涵蓋可同時成立。 事件來源 → 平台: 依到達順序追蹤告警，依事件時間定位分析區間 波形資料 → 分析派工: 依事件窗檢查波形是否就緒，再交給局放分析 分析服務 → 事件介面: 呈現 PRPD、執行狀態與資料涵蓋</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="539" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">告警到了，哪些波形已能分析</tspan><tspan x="28" dy="37.12">？</tspan></text>
<rect x="76" y="125.24" width="352" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">事件來源 → 平台</tspan></text><text x="91" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">依到達順序追蹤告警，依事件時間定</tspan><tspan x="91" dy="25.6">位分析區間</tspan></text><circle cx="43" cy="149.24" r="14" fill="#0d5e55"/><text x="38" y="155.24" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">1</tspan></text><path d="M43 165.24V259.6" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="251.6" width="352" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="282.6" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">波形資料 → 分析派工</tspan></text><text x="91" y="310.76000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">依事件窗檢查波形是否就緒，再交給</tspan><tspan x="91" dy="25.6">局放分析</tspan></text><circle cx="43" cy="275.6" r="14" fill="#0d5e55"/><text x="38" y="281.6" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">2</tspan></text><path d="M43 291.6V385.96" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="377.96" width="352" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="91" y="408.96" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="91" dy="0">分析服務 → 事件介面</tspan></text><text x="91" y="437.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">呈現 PRPD、執行狀態與資料涵蓋</tspan></text><circle cx="43" cy="401.96" r="14" fill="#0d5e55"/><text x="38" y="407.96" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">3</tspan></text>
<path d="M28 490.71999999999997H428" stroke="#a7babb"/><text x="28" y="515.72" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">成功執行與部分資料涵蓋可同時成立。</tspan></text>
</g></svg>
