<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 660" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">觀光需求怎麼影響路線與班次？</title><desc id="desc">需求是代理訊號推估。實際乘車量與營運成效仍待驗證。 需求訊號: 人流、搜尋熱度與熱門時段 景點距離: 以點間距離形成分組矩陣 分時需求與路線: 月人流分攤到星期與小時，探索 TSP 路線 空間方案: 以地圖檢視路線 時段規劃: 以班表及流向圖比較</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="456" height="660" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">觀光需求怎麼影響路線與班次</tspan><tspan x="28" dy="37.12">？</tspan></text>
<text x="28" y="139.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">觀察訊號</tspan></text><rect x="28" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">需求訊號</tspan></text><text x="43" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">人流、搜尋熱度與</tspan><tspan x="43" dy="25.6">熱門時段</tspan></text><rect x="234" y="153.24" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">景點距離</tspan></text><text x="249" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">以點間距離形成分</tspan><tspan x="249" dy="25.6">組矩陣</tspan></text><path d="M125 266.6V280.6H331V266.6" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 280.6V300.6" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="300.6" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="331.6" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">分時需求與路線</tspan></text><text x="43" y="359.76000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">月人流分攤到星期與小時，探索 TSP 路</tspan><tspan x="43" dy="25.6">線</tspan></text><path d="M228 413.96000000000004V427.96000000000004H125V447.96000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 427.96000000000004H331V447.96000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="447.96000000000004" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="478.96000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">空間方案</tspan></text><text x="43" y="507.12000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">以地圖檢視路線</tspan></text><rect x="234" y="447.96000000000004" width="194" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="478.96000000000004" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">時段規劃</tspan></text><text x="249" y="507.12000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">以班表及流向圖比</tspan><tspan x="249" dy="25.6">較</tspan></text>
<path d="M28 586.32H428" stroke="#a7babb"/><text x="28" y="611.32" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">需求是代理訊號推估。實際乘車量與營運成效</tspan><tspan x="28" dy="25.6">仍待驗證。</tspan></text>
</g></svg>
