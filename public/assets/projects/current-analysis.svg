<text x="55" y="419.76" fill="#172e3b" font-size="22" font-weight="600"><tspan x="55" dy="0">資料覆蓋與事件口徑</tspan></text>
<text x="55" y="451.92" fill="#52636d" font-size="19"><tspan x="55" dy="0">補缺口、核對重疊時戳</tspan></text>
