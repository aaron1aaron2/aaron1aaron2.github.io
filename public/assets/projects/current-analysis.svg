<text x="410" y="302.26" fill="#172e3b" font-size="22" font-weight="600"><tspan x="410" dy="0">依工況分層比較</tspan></text>
<text x="410" y="334.42" fill="#52636d" font-size="19"><tspan x="410" dy="0">分鐘中位數、檢定與效果量</tspan></text>
