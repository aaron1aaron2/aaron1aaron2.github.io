<rect x="28" y="125.24" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="156.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Check the inputs</tspan></text><text x="43" y="184.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Align machine context, waveform</tspan><tspan x="43" dy="25.6">coverage and operating windows</tspan></text><path d="M228 238.6V261.6" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="261.6" width="400" height="113.36" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="292.6" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Validate each stage</tspan></text><text x="43" y="320.76000000000005" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Check operating detection, anomalies</tspan><tspan x="43" dy="25.6">, severity and remaining life</tspan></text><path d="M228 374.96000000000004V397.96000000000004" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="397.96000000000004" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="428.96000000000004" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">Bound the conclusion</tspan></text><text x="43" y="457.12000000000006" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Preserve intermediate artifacts and</tspan><tspan x="43" dy="25.6">conditions</tspan></text>
