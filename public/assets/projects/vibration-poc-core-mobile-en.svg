<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 610" role="img" aria-labelledby="title desc" lang="en">
<title id="title">When does vibration data support a diagnosis?</title><desc id="desc">The proof of concept evaluated feasibility and conditions for adoption. Check the inputs: Align machine context, waveform coverage and operating windows Validate each stage: Check operating detection, anomalies, severity and remaining life Bound the conclusion: Preserve intermediate artifacts and conditions</desc>
