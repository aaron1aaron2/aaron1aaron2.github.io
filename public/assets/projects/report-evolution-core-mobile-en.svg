<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 872" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How diagnostic reports retain checkable evidence</title><desc id="desc">Platform integration and section-level regeneration prototypes are tracked separately. Device observations: Check values and classification against observations Data limits: Record missing inputs and diagnostic limits Separate evidence from narrative: Testable nodes produce findings. The LLM organizes the wording. Platform dispatch and download: Dispatch work and deliver DOCX Trace findings: Keep intermediate artifacts for review</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
