<text x="28" y="42" fill="#18353d" font-size="29" font-weight="700"><tspan x="28" dy="0">How diagnostic reports</tspan><tspan x="28" dy="37.12">retain checkable evidence</tspan></text>
<text x="28" y="139.24" fill="#0d5e55" font-size="17" font-weight="700"><tspan x="28" dy="0">Data and diagnosis</tspan></text><rect x="28" y="153.24" width="194" height="218.32" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Device</tspan><tspan x="43" dy="28.16">observations</tspan></text><text x="43" y="240.56" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Check values</tspan><tspan x="43" dy="25.6">and</tspan><tspan x="43" dy="25.6">classification</tspan><tspan x="43" dy="25.6">against</tspan><tspan x="43" dy="25.6">observations</tspan></text><rect x="234" y="153.24" width="194" height="218.32" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="184.24" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">Data limits</tspan></text><text x="249" y="212.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">Record missing</tspan><tspan x="249" dy="25.6">inputs and</tspan><tspan x="249" dy="25.6">diagnostic limits</tspan></text><path d="M125 371.56V385.56H331V371.56" fill="none" stroke="#4b6c72" stroke-width="2"/><path d="M228 385.56V405.56" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="405.56" width="400" height="113.36" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="43" y="436.56" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="43" dy="0">Separate evidence from narrative</tspan></text><text x="43" y="464.72" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Testable nodes produce findings.</tspan><tspan x="43" dy="25.6">The LLM organizes the wording.</tspan></text><path d="M228 518.92V532.92H125V552.92" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M228 532.92H331V552.92" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="552.92" width="194" height="195.28000000000003" rx="4" fill="white" stroke="#a7babb"/><text x="43" y="583.92" fill="#18353d" font-size="22" font-weight="700"><tspan x="43" dy="0">Platform</tspan><tspan x="43" dy="28.16">dispatch and</tspan><tspan x="43" dy="28.16">download</tspan></text><text x="43" y="668.4" fill="#455d66" font-size="20" font-weight="500"><tspan x="43" dy="0">Dispatch work</tspan><tspan x="43" dy="25.6">and deliver</tspan><tspan x="43" dy="25.6">DOCX</tspan></text><rect x="234" y="552.92" width="194" height="195.28000000000003" rx="4" fill="white" stroke="#a7babb"/><text x="249" y="583.92" fill="#18353d" font-size="22" font-weight="700"><tspan x="249" dy="0">Trace findings</tspan></text><text x="249" y="612.0799999999999" fill="#455d66" font-size="20" font-weight="500"><tspan x="249" dy="0">Keep</tspan><tspan x="249" dy="25.6">intermediate</tspan><tspan x="249" dy="25.6">artifacts for</tspan><tspan x="249" dy="25.6">review</tspan></text>
<path d="M28 773.2H428" stroke="#a7babb"/><text x="28" y="798.2" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">Platform integration and section-level</tspan><tspan x="28" dy="25.6">regeneration prototypes are tracked</tspan><tspan x="28" dy="25.6">separately.</tspan></text>
