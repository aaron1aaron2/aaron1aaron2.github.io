<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 634" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">診斷報告如何保留可核對的依據</title><desc id="desc">平台整合和指定段落重生的原型驗證，分別記錄。 設備資料: 以觀測資料核對數值與分類 資料限制: 標明缺項與可判讀範圍 診斷與敘事分工: 可測試節點產出診斷，LLM 組織文字 平台派工與下載: 平台派工並交付 DOCX 可回查數值: 保留中間產物，支援重看結論</desc>
