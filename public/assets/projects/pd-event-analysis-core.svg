<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">告警到了，哪些波形已能分析？</title><desc id="desc">成功執行與部分資料涵蓋可同時成立。 事件來源 → 平台: 依到達順序追蹤告警，依事件時間定位分析區間 波形資料 → 分析派工: 依事件窗檢查波形是否就緒，再交給局放分析 分析服務 → 事件介面: 呈現 PRPD、執行狀態與資料涵蓋</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#4b6c72"/></marker></defs>
<rect width="720" height="454" fill="white"/><g font-family="Arial, Microsoft JhengHei, sans-serif">
<text x="28" y="42" fill="#18353d" font-size="32" font-weight="700"><tspan x="28" dy="0">告警到了，哪些波形已能分析？</tspan></text>
<rect x="76" y="91.96000000000001" width="616" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="122.96000000000001" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">事件來源 → 平台</tspan></text><text x="91" y="151.12" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">依到達順序追蹤告警，依事件時間定位分析區間</tspan></text><circle cx="43" cy="115.96000000000001" r="14" fill="#0d5e55"/><text x="38" y="121.96000000000001" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">1</tspan></text><path d="M43 131.96V200.72" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="192.72" width="616" height="87.75999999999999" rx="4" fill="white" stroke="#a7babb"/><text x="91" y="223.72" fill="#18353d" font-size="22" font-weight="700"><tspan x="91" dy="0">波形資料 → 分析派工</tspan></text><text x="91" y="251.88" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">依事件窗檢查波形是否就緒，再交給局放分析</tspan></text><circle cx="43" cy="216.72" r="14" fill="#0d5e55"/><text x="38" y="222.72" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">2</tspan></text><path d="M43 232.72V301.48" fill="none" stroke="#4b6c72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="76" y="293.48" width="616" height="87.75999999999999" rx="4" fill="#f1f7f5" stroke="#0d5e55"/><text x="91" y="324.48" fill="#0d5e55" font-size="22" font-weight="700"><tspan x="91" dy="0">分析服務 → 事件介面</tspan></text><text x="91" y="352.64000000000004" fill="#455d66" font-size="20" font-weight="500"><tspan x="91" dy="0">呈現 PRPD、執行狀態與資料涵蓋</tspan></text><circle cx="43" cy="317.48" r="14" fill="#0d5e55"/><text x="38" y="323.48" fill="white" font-size="17" font-weight="700"><tspan x="38" dy="0">3</tspan></text>
<path d="M28 406.24H692" stroke="#a7babb"/><text x="28" y="431.24" fill="#455d66" font-size="20" font-weight="500"><tspan x="28" dy="0">成功執行與部分資料涵蓋可同時成立。</tspan></text>
</g></svg>
